enshot is captured and saved.</li>\n<li>If anything fails, an error is logged to stderr but <code>launch()</code>\nstill resolves with a working browser.</li>\n</ol>\n<h2>Ad-hoc screenshot (library)</h2>\n<pre><code class=\"language-js\">const { launch } = require(&#39;./headless&#39;);\nconst { page, screenshot, close } = await launch({ url: &#39;https://example.com&#39; });\n\n// 1. Bare call — auto-name under ./screenshots/\nconst p1 = await screenshot();\n\n// 2. Explicit path, infer format from extension\nconst p2 = await screenshot(&#39;foo.png&#39;);\n\n// 3. Options object (full Playwright surface)\nconst p3 = await screenshot({ path: &#39;bar.jpg&#39;, type: &#39;jpeg&#39;, quality: 60, fullPage: true });\n\n// 4. Path + overrides\nconst p4 = await screenshot(&#39;zoom.png&#39;, { clip: { x: 0, y: 0, width: 800, height: 200 } });\n\n// 5. Element screenshot\nconst p5 = await screenshot(&#39;logo.png&#39;, { element: page.locator(&#39;header img&#39;) });\n\nawait close();\n</code></pre>\n<h2>All supported options</h2>\n<p>All <a href=\"https://playwright.dev/docs/api/class-page#page-screenshot\">Playwright <code>page.screenshot</code> options</a>\nare passed through. The most useful:</p>\n<table>\n<thead>\n<tr>\n<th>Option</th>\n<th>Type</th>\n<th>Default</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>path</code></td>\n<td><code>string</code></td>\n<td>auto</td>\n<td>Absolute or relative output path. Created if missing.</td>\n</tr>\n<tr>\n<td><code>type</code></td>\n<td><code>&#39;png&#39; | &#39;jpeg&#39;</code></td>\n<td>from extension</td>\n<td>Image format. Stripped from the call if you also pass <code>path</code>&#39;s extension.</td>\n</tr>\n<tr>\n<td><code>quality</code></td>\n<td><code>number</code></td>\n<td><code>80</code></td>\n<td>JPEG quality 0-100. <strong>Automatically stripped for PNG</strong> (Playwright throws).</td>\n</tr>\n<tr>\n<td><code>fullPage</code></td>\n<td><code>boolean</code></td>\n<td><code>false</code></td>\n<td>Capture the entire scrollable page, not just the viewport.</td>\n</tr>\n<tr>\n<td><code>clip</code></td>\n<td><code>{x, y, width, height}</code></td>\n<td>—</td>\n<td>Capture only a sub-region of the page.</td>\n</tr>\n<tr>\n<td><code>element</code></td>\n<td><code>ElementHandle</code></td>\n<td>—</td>\n<td>Screenshot just this element.</td>\n</tr>\n<tr>\n<td><code>omitBackground</code></td>\n<td><code>boolean</code></td>\n<td><code>false</code></td>\n<td>Make the background transparent.</td>\n</tr>\n<tr>\n<td><code>caret</code></td>\n<td><code>&#39;hide&#39; | &#39;initial&#39;</code></td>\n<td>—</td>\n<td>Show or hide the text caret.</td>\n</tr>\n<tr>\n<td><code>animations</code></td>\n<td><code>&#39;allow&#39; | &#39;disabled&#39;</code></td>\n<td><code>&#39;allow&#39;</code></td>\n<td>Whether to run CSS animations.</td>\n</tr>\n<tr>\n<td><code>mask</code></td>\n<td><code>Locator[]</code></td>\n<td>—</td>\n<td>Locators to mask out (draw black boxes).</td>\n</tr>\n</tbody></table>\n<h2>File naming</h2>\n<p>If you don&#39;t pass a path, the helper builds one like:</p>\n<pre><code>./screenshots/screenshot-2026-07-20_15-00-30.png\n./screenshots/screenshot-2026-07-20_15-00-30.jpg   (if format=jpeg)\n</code></pre>\n<p>The <code>./screenshots/</code> directory is created automatically the first\ntime you take a screenshot. The <code>screenshot-</code> prefix and timestamp\nsort lexically, so a directory listing puts them in chronological\norder.</p>\n<h2>Where the file ends up</h2>\n<table>\n<thead>\n<tr>\n<th>You pass...</th>\n<th>File ends up at...</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>screenshot(&#39;foo.png&#39;)</code></td>\n<td><code>&lt;cwd&gt;/foo.png</code> (relative to where you ran the script)</td>\n</tr>\n<tr>\n<td><code>screenshot(&#39;/abs/foo.png&#39;)</code></td>\n<td><code>/abs/foo.png</code> (absolute path honored)</td>\n</tr>\n<tr>\n<td><code>screenshot()</code></td>\n<td><code>./screenshots/screenshot-&lt;ts&gt;.&lt;ext&gt;</code></td>\n</tr>\n<tr>\n<td><code>screenshot({ path: &#39;foo.png&#39; })</code></td>\n<td><code>&lt;cwd&gt;/foo.png</code></td>\n</tr>\n</tbody></table>\n<p>The returned path is always absolute, regardless of how it was\nspecified.</p>\n<h2>Returned value</h2>\n<p>The <code>screenshot()</code> helper always returns the <strong>absolute path</strong> of\nthe file written:</p>\n<pre><code class=\"language-js\">const p = await screenshot(&#39;foo.png&#39;);\n// p is something like &#39;/opt/lampp/htdocs/ServerBrowser/foo.png&#39;\nconsole.log(&#39;wrote&#39;, p, fs.statSync(p).size, &#39;bytes&#39;);\n</code></pre>\n<p>It also updates the <code>lastScreenshotPath</code> getter on the launch\nresult:</p>\n<pre><code class=\"language-js\">const { lastScreenshotPath } = await launch({ ... });\nawait screenshot(&#39;a.png&#39;);\nawait screenshot(&#39;b.png&#39;);\nconsole.log(lastScreenshotPath);   // &#39;.../b.png&#39;\n</code></pre>\n<p>The getter means the value is always current, even after\ndestructuring, as long as you read it through the object (<code>r.lastScreenshotPath</code>)\nrather than via a destructured local (<code>const { lastScreenshotPath } = r</code>).</p>\n<h2>Errors</h2>\n<p>If a screenshot fails:</p>\n<ul>\n<li>The error is <strong>logged</strong> but doesn&#39;t throw.</li>\n<li>The <code>lastScreenshotPath</code> is <strong>not</strong> updated.</li>\n<li>The browser session continues normally.</li>\n</ul>\n<p>This is intentional: in long-running scripts, a failed screenshot\nshouldn&#39;t take down the whole process.</p>\n","headings":[]},{"name":"search","file":"search.md","html":"<h1>Web search</h1>\n<p>The <code>search()</code> helper runs a web search through one of three\n<strong>bot-friendly</strong> engines, with a built-in <strong>fallback chain</strong> so a\nsingle engine being down (or starting to block you) doesn&#39;t break\nyour workflow.</p>\n<h2>Engines</h2>\n<table>\n<thead>\n<tr>\n<th>Engine name</th>\n<th>Endpoint</th>\n<th>Why it works</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>duckduckgo-html</code></td>\n<td><code>https://html.duckduckgo.com/html/?q=…</code></td>\n<td>The <strong>primary</strong> choice. This is DDG&#39;s purpose-built endpoint for bots and tools — it doesn&#39;t run JavaScript, doesn&#39;t throw a captcha, and returns clean HTML. Most <code>ddgr</code>-style CLI tools use it.</td>\n</tr>\n<tr>\n<td><code>brave</code></td>\n<td><code>https://search.brave.com/search?q=…</code></td>\n<td><strong>Fallback 1.</strong> Modern, no captcha for our fingerprint.</td>\n</tr>\n<tr>\n<td><code>searxng</code></td>\n<td><code>&lt;instance&gt;/search?q=…&amp;format=html</code></td>\n<td><strong>Fallback 2.</strong> Open-source metasearch. You can run your own instance or use a public one. The default public instance is <code>https://paulgo.io</code> but you should swap this for a more reliable one (e.g. <code>https://searx.be</code>).</td>\n</tr>\n</tbody></table>\n<p>Aliases:</p>\n<ul>\n<li><code>ddg</code> is an alias for <code>duckduckgo-html</code>.</li>\n</ul>\n<h3>Why not Google?</h3>\n<p>Google reliably throws a captcha on the first suspicious request and\non every subsequent request from the same fingerprint. Even with the\nstealth layer, success rates are &lt; 30% per request. Not worth\nshipping.</p>\n<h3>Why not Bing?</h3>\n<p>Bing <em>does</em> work for some users, but is also captcha-prone and the\nDOM is heavy. We didn&#39;t pick it as a default.</p>\n<h3>Why not Startpage?</h3>\n<p>Startpage is JS-heavy and has its own bot detection. The DOM\nextractor we tried returned 0 results consistently. Excluded.</p>\n<h3>Why not Yandex?</h3>\n<p>Yandex works but English-language results are inconsistent and the\ncaptcha risk is non-trivial. Excluded.</p>\n<h2>Default behavior</h2>\n<pre><code class=\"language-js\">const { search } = require(&#39;./headless&#39;);\nconst r = await search(&#39;node js tutorial&#39;);\n</code></pre>\n<ul>\n<li>Tries <code>duckduckgo-html</code> first.</li>\n<li>If that returns zero results (or errors), tries <code>brave</code>.</li>\n<li>If that also fails, tries <code>searxng</code>.</li>\n<li>If all three fail, returns <code>{ query, engine: null, results: [], tried: [...] }</code>\nwith diagnostic info in <code>tried</code>.</li>\n<li>The first engine to return at least one result wins.</li>\n</ul>\n<p>You can override the chain:</p>\n<pre><code class=\"language-js\">const r = await search(&#39;rust async&#39;, {\n  engine:   &#39;brave&#39;,                  // primary\n  fallback: [&#39;duckduckgo-html&#39;],      // what to try if brave fails\n});\n</code></pre>\n<h2>CLI quick reference</h2>\n<pre><code class=\"language-bash\"># Default (DDG, 10 results)\nnode headless.js --search &quot;playwright tutorial&quot;\n\n# Limit to 5\nnode headless.js --search &quot;playwright tutorial&quot; --search-limit 5\n\n# Use Brave explicitly\nnode headless.js --search &quot;rust async&quot; --search-engine=brave\n\n# Use a custom SearXNG instance\nnode headless.js --search &quot;privacy news&quot; \\\n  --search-engine=searxng \\\n  --searxng-instance=https://searx.be\n\n# JSON output (pipe into jq)\nnode headless.js --search &quot;node streams&quot; --search-json | jq &#39;.results[].url&#39;\n\n# Screenshot of the results page\nnode headless.js --search &quot;hello world&quot; --search-shot\n</code></pre>\n<h2>Library quick reference</h2>\n<pre><code class=\"language-js\">const { search, launch, formatResults, ENGINES } = require(&#39;./headless&#39;);\n\n// 1. One-shot (opens + closes a context for you)\nconst r = await search(&#39;node js tutorial&#39;, { limit: 5 });\nconsole.log(formatResults(r));\n\n// 2. With a long-lived context (share cookies across searches)\nconst { context, close } = await launch({ profileDir: &#39;./profiles/me&#39; });\ntry {\n  // Use the lower-level search() that takes a context:\n  const { search: ctxSearch } = require(&#39;./search&#39;);\n  const r1 = await ctxSearch(context, &#39;first query&#39;);\n  const r2 = await ctxSearch(context, &#39;second query&#39;);\n} finally {\n  await close();\n}\n</code></pre>\n<h2>Result shape</h2>\n<pre><code class=\"language-ts\">type SearchResult = {\n  title:    string;      // result headline\n  url:      string;      // canonical, un-rewritten URL\n  snippet?: string;      // short description (may be empty)\n  engine:   string;      // which engine returned this\n  position: number;      // 1-based\n};\n\ntype SearchResponse = {\n  query:   string;\n  engine:  string | null;            // which engine actually succeeded\n  results: SearchResult[];\n  tried:   Array&lt;\n    | string                           // engine name (success)\n    | { engine: string; error: string }  // engine that failed\n  &gt;;\n};\n</code></pre>\n<p><code>formatResults(r)</code> pretty-prints this to a string for CLI use:</p>\n<pre><code>Search: node js tutorial  (engine: duckduckgo-html, 5 results)\n  1. Tutorial | Node.js\n     https://nodejs.org/en/learn/getting-started/introduction-to-nodejs\n     ...\n  2. ...\n</code></pre>\n<h2>How each engine is queried</h2>\n<p>For each engine the <code>search.js</code> module knows how to:</p>\n<ul>\n<li><strong>Build the URL</strong> with the query.</li>\n<li><strong>Pick a wait condition</strong> (<code>domcontentloaded</code> is enough for the\nHTML endpoint; <code>networkidle</code> for the JS-heavy ones).</li>\n<li><strong>Wait for a result-specific selector</strong> so the parser doesn&#39;t run\nbefore the page has results.</li>\n<li><strong>Decide if the page looks blocked</strong> (specific phrases like &quot;Just\na moment&quot;, Cloudflare challenge elements, or zero results).</li>\n<li><strong>Extract a <code>{title, url, snippet}</code> triple per result</strong>, unwrapping\nredirects (e.g. DDG&#39;s <code>?uddg=</code> wrapping) and filtering out the\nengine&#39;s own UI links.</li>\n</ul>\n<h2>Picking a SearXNG instance</h2>\n<p>SearXNG is open-source and anyone can run an instance. Public\ninstances are listed at <a href=\"https://searx.space\">https://searx.space</a> (the tracker that tells\nyou which instances are alive and not blocked).</p>\n<p>A few reliable public ones (check the tracker for current status):</p>\n<ul>\n<li><code>https://searx.be</code></li>\n<li><code>https://search.bus-hit.me</code></li>\n<li><code>https://searx.tiekoetter.com</code></li>\n</ul>\n<p>You can also run your own — it&#39;s a single Docker container.</p>\n<p>The CLI sets the default to <code>https://paulgo.io</code>, but you should\noverride with <code>--searxng-instance=...</code> for reliability.</p>\n<h2>The <code>tried</code> field</h2>\n<p><code>r.tried</code> is a diagnostic. If everything worked, it&#39;s just\n<code>[&#39;duckduckgo-html&#39;]</code> (or whichever engine succeeded). If something\nfailed, the failed entries are objects with an <code>error</code> string:</p>\n<pre><code class=\"language-js\">{\n  tried: [\n    { engine: &#39;duckduckgo-html&#39;, error: &#39;page looked blocked&#39; },\n    { engine: &#39;brave&#39;,           error: &#39;no results parsed&#39; },\n    &#39;searxng&#39;,   // ← this one succeeded\n  ]\n}\n</code></pre>\n<p>Use this to debug &quot;search returned nothing&quot; cases. The error strings\nare short and human-readable.</p>\n<h2>When all engines fail</h2>\n<p>By default, the helper returns an empty <code>results</code> array and the\n<code>tried</code> field tells you why each engine failed. If you&#39;d rather get\nan exception:</p>\n<pre><code class=\"language-js\">const r = await search(&#39;query&#39;, { throwOnFail: true });\n// throws: Error: All search engines failed for query &quot;query&quot;: [...]\n</code></pre>\n<h2>Performance</h2>\n<p>A single search takes ~2-3 seconds (mostly waiting for the page\nsettle). The engines are tried <strong>sequentially</strong> in fallback order,\nso a search that needs all three fallbacks takes ~6-9 seconds. If\nyou need to do many searches in parallel, launch multiple\n<code>launch()</code> contexts.</p>\n<h2>Limitations</h2>\n<ul>\n<li><strong>English-language queries</strong> work best on all three engines.</li>\n<li><strong>Non-Latin scripts</strong> (Chinese, Arabic, etc.) work but the\nsnippets are sometimes empty for the HTML endpoint.</li>\n<li><strong>Time-sensitive queries</strong> (&quot;weather today&quot;) may return slightly\nolder results than the engine&#39;s web UI because we&#39;re hitting\nthe simplified endpoints.</li>\n<li><strong>No image / video / news search</strong>. Only the main web-result\nlist. (Easy to extend if you need it; each engine&#39;s HTML output\nhas separate tabs.)</li>\n</ul>\n","headings":[]},{"name":"stealth","file":"stealth.md","html":"<h1>Stealth layer</h1>\n<p>The &quot;stealth&quot; patches hide the fact that the browser is automated.\nThis page explains what each patch does, why, and what it does NOT\ndo.</p>\n<h2>What the bot-detection industry looks at</h2>\n<p>Anti-bot services (FingerprintJS, Cloudflare, DataDome, PerimeterX,\nKasada, CreepJS, ...) use a mix of techniques. The most common\n<strong>technical</strong> tells for a vanilla headless Chromium are:</p>\n<table>\n<thead>\n<tr>\n<th>Signal</th>\n<th>What they do with it</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>navigator.webdriver === true</code></td>\n<td>Trivially flags the page as automated.</td>\n</tr>\n<tr>\n<td><code>cdc_adoQpoasnfa76pfcZLmcfl_</code> global</td>\n<td>Injected by Playwright/CDP into every page.</td>\n</tr>\n<tr>\n<td><code>__webdriver_evaluate</code> / <code>__webdriver_scriptFunction</code> etc. on Navigator/Document</td>\n<td>Same — Playwright injection artifact.</td>\n</tr>\n<tr>\n<td>Missing <code>window.chrome</code></td>\n<td>Headless Chromium doesn&#39;t expose it; real Chrome always does.</td>\n</tr>\n<tr>\n<td><code>navigator.plugins.length === 0</code></td>\n<td>Headless reports 0 plugins. Real Chrome has at least 5.</td>\n</tr>\n<tr>\n<td><code>navigator.mimeTypes.length === 0</code></td>\n<td>Same idea.</td>\n</tr>\n<tr>\n<td><code>WebGL UNMASKED_VENDOR_WEBGL === &quot;Google Inc.&quot;</code> and <code>UNMASKED_RENDERER_WEBGL === &quot;SwiftShader&quot;</code></td>\n<td>Headless falls back to the SwiftShader software renderer.</td>\n</tr>\n<tr>\n<td><code>Permissions.query({name:&#39;notifications&#39;})</code> returning a non-<code>prompt</code> value when no decision has been made</td>\n<td>Indicates headless.</td>\n</tr>\n<tr>\n<td><code>navigator.languages</code> empty or not matching the locale</td>\n<td>Indicates a default browser install.</td>\n</tr>\n<tr>\n<td><code>User-Agent</code> contains <code>HeadlessChrome</code></td>\n<td>Direct flag.</td>\n</tr>\n<tr>\n<td>Visible &quot;Chrome is being controlled by automated test software&quot; infobar</td>\n<td>Direct flag.</td>\n</tr>\n</tbody></table>\n<p>The <code>ServerBrowser/</code> stealth layer (in <code>stealth.js</code>, injected via\n<code>addInitScript</code> so it runs <strong>before</strong> any page script) patches every\none of these. The full mapping is:</p>\n<table>\n<thead>\n<tr>\n<th>Signal</th>\n<th>Patch</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>navigator.webdriver</code></td>\n<td><code>Object.defineProperty</code> on <code>Navigator.prototype</code> to return <code>undefined</code>.</td>\n</tr>\n<tr>\n<td><code>cdc_*</code> / <code>__webdriver_*</code> / <code>__phantom*</code> / <code>__nightmare*</code> / <code>__driver_*</code> / <code>__selenium_*</code> globals</td>\n<td><code>delete</code> from <code>window</code>, <code>document</code>, <code>Navigator.prototype</code>, <code>Document.prototype</code>.</td>\n</tr>\n<tr>\n<td>Missing <code>window.chrome</code></td>\n<td>Stub <code>window.chrome.app</code>, <code>chrome.csi()</code>, <code>chrome.loadTimes()</code>, <code>chrome.runtime</code>.</td>\n</tr>\n<tr>\n<td>0 <code>navigator.plugins</code> / <code>mimeTypes</code></td>\n<td>Replace with a 6-plugin PluginArray (PDF, Native Client, etc.) and a 4-mimeType MimeTypeArray, with <code>item()</code>/<code>namedItem()</code>/<code>refresh()</code> methods.</td>\n</tr>\n<tr>\n<td><code>WebGL vendor/renderer = SwiftShader</code></td>\n<td>Patch <code>WebGLRenderingContext.getParameter</code> to return <code>Intel Inc.</code> and <code>Intel Iris OpenGL Engine</code> for the unmasked vendor/renderer params. Also expose the <code>WEBGL_debug_renderer_info</code> extension.</td>\n</tr>\n<tr>\n<td><code>Permissions.query</code> for notifications</td>\n<td>Forward <code>Notification.permission</code> directly instead of the default.</td>\n</tr>\n<tr>\n<td><code>navigator.languages</code> mismatch</td>\n<td>Override to <code>[&#39;en-US&#39;, &#39;en&#39;]</code> to match the default locale.</td>\n</tr>\n<tr>\n<td>UA contains &quot;Headless&quot;</td>\n<td>Rewrite via <code>Navigator.prototype</code> getter (belt and suspenders; primary fix is the <code>userAgent</code> launch option).</td>\n</tr>\n<tr>\n<td>Chrome infobar</td>\n<td><code>ignoreDefaultArgs: [&#39;--enable-automation&#39;]</code> + <code>disable-blink-features=AutomationControlled</code> + <code>--no-first-run</code> + <code>--no-default-browser-check</code>.</td>\n</tr>\n<tr>\n<td>Old headless mode</td>\n<td>Uses the new headless implementation (Playwright &gt;= 1.40 default, which is dramatically less bot-like).</td>\n</tr>\n<tr>\n<td>Bundled Chromium not Chrome</td>\n<td><code>channel: &#39;chrome&#39;</code> + <code>executablePath: &#39;/usr/bin/google-chrome&#39;</code>.</td>\n</tr>\n<tr>\n<td><code>navigator.connection</code> missing</td>\n<td>Stub with <code>{ effectiveType: &#39;4g&#39;, rtt: 50, downlink: 10, saveData: false }</code>.</td>\n</tr>\n</tbody></table>\n<p>The result: a fresh <code>https://bot.sannysoft.com</code> run reports all\nchecks <strong>passing</strong>.</p>\n<h2>Testing your own stealth</h2>\n<h3>1. The built-in <code>--check</code> mode</h3>\n<pre><code class=\"language-bash\">node headless.js --check https://bot.sannysoft.com\n</code></pre>\n<p>Output is a JSON fingerprint. Look for:</p>\n<ul>\n<li><code>webdriver</code> is <strong>missing</strong> (= <code>undefined</code>) — the number-one\ngiveaway is gone.</li>\n<li><code>userAgent</code> does NOT contain <code>Headless</code>.</li>\n<li><code>plugins</code> is <code>6</code>, <code>mimeTypes</code> is <code>4</code> (not 0).</li>\n<li><code>hasChrome</code>, <code>hasChromeRuntime</code>, <code>hasChromeCSI</code>, <code>hasChromeLoadTimes</code> are all <code>true</code>.</li>\n<li><code>webglVendor</code> is <code>Intel Inc.</code>, not <code>Google Inc.</code></li>\n<li><code>webglRenderer</code> is <code>Intel Iris OpenGL Engine</code>, not <code>SwiftShader</code>.</li>\n</ul>\n<h3>2. Other public detection sites</h3>\n<p>These are all reachable through the stealth browser and will report\nclean:</p>\n<ul>\n<li><code>https://bot.sannysoft.com</code> — the gold-standard basic test.</li>\n<li><code>https://intoli.com/blog/not-possible-to-block-chrome-headless/chrome-headless-test.html</code> — Intoli&#39;s test.</li>\n<li><code>https://browserleaks.com</code> — IP / canvas / WebGL leaks.</li>\n<li><code>https://fingerprintjs.github.io/fingerprintjs/</code> — FingerprintJS demo.</li>\n</ul>\n<p>For the very-hardest suites (e.g. <code>https://abrahamjuliot.github.io/creepjs/</code>),\neven the stealth layer is not enough — those use canvas/font\nfingerprinting that no open-source patch can reliably defeat.</p>\n<h3>3. The library form</h3>\n<pre><code class=\"language-js\">const { launch } = require(&#39;./headless&#39;);\nconst { page, close } = await launch({ url: &#39;https://bot.sannysoft.com&#39; });\nconst report = await page.evaluate(() =&gt; ({\n  webdriver:        navigator.webdriver,\n  hasWebDriverCdc:  typeof window.cdc_adoQpoasnfa76pfcZLmcfl_ !== &#39;undefined&#39;,\n  hasChrome:        !!window.chrome,\n  pluginsLength:    navigator.plugins.length,\n}));\nconsole.log(report);\nawait close();\n</code></pre>\n<p>Expected output:</p>\n<pre><code class=\"language-js\">{\n  webdriver: undefined,         // ← properly hidden\n  hasWebDriverCdc: false,       // ← no Playwright injection marker\n  hasChrome: true,\n  pluginsLength: 6,\n}\n</code></pre>\n<h2>What the stealth layer does NOT do</h2>\n<p>Be aware of the limits:</p>\n<ol>\n<li><strong>No canvas/font/audio fingerprint randomization.</strong> The pixel-level\nnoise in canvas rendering is slightly different per browser\nconfiguration. Sophisticated fingerprinters (CreepJS, FPStalker)\ncan still distinguish you from a &quot;real&quot; user if you visit the\nsame site many times — the noise is stable, just unique.</li>\n<li><strong>No proxy integration.</strong> If the IP you come from is on a spam\nlist, no amount of browser-level stealth helps. Configure a\nresidential proxy outside of this project.</li>\n<li><strong>No behavioral defense.</strong> If you make 100 requests in 5 seconds,\nyou&#39;ll get rate-limited. The <code>human.*</code> helpers add per-action\ndelays, but for high-volume use you need to add your own\nbackoff.</li>\n<li><strong>Not 100% against the hardest suites.</strong> The very best\nfingerprinting tools combine IP, canvas, audio, font,\n<code>navigator.*</code>, and CDP-level signals. The stealth layer makes you\n<strong>inconclusive</strong> rather than definitively real — most sites will\nlet you through, but the most paranoid ones may still flag you.</li>\n<li><strong>No CAPTCHA solving.</strong> If a site shows a CAPTCHA, the script\ncannot solve it. Use <code>--headed</code> to solve it manually; the\nsuccessful login persists in the profile.</li>\n<li><strong>No ToS enforcement.</strong> This is a technical tool. Don&#39;t use it\nto violate a site&#39;s terms of service.</li>\n</ol>\n<h2>Cloudflare Turnstile / CAPTCHA handling (VNC headed session)</h2>\n<p>When driving the <strong>live VNC Chrome</strong> (<code>npm run vnc</code>), the stealth layer in\n<code>stealth.js</code> is <strong>not automatically applied</strong> — <code>stealth.js</code> is only used\nby <code>headless.js</code>. The VNC Chrome is launched by <code>scripts/vnc-driver.js</code>,\nwhich has its own anti-detection setup. Here is the full technique for\nkeeping Cloudflare happy in a headed VNC session.</p>\n<h3>The problem — what Cloudflare Turnstile checks</h3>\n<table>\n<thead>\n<tr>\n<th>Signal</th>\n<th>Why it matters</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>navigator.webdriver === true</code></td>\n<td>The <strong>#1</strong> giveaway. Chrome sets this when launched via CDP/Playwright.</td>\n</tr>\n<tr>\n<td><code>window.cdc_*</code> / <code>__webdriver_*</code> globals</td>\n<td>Injection artifacts from Playwright/CDP.</td>\n</tr>\n<tr>\n<td>Rapid page navigation</td>\n<td>5+ URLs in &lt; 30 seconds looks like a scraper, not a human.</td>\n</tr>\n<tr>\n<td>Missing human interaction delays</td>\n<td>Humans take 2–5 seconds between clicks; bots take milliseconds.</td>\n</tr>\n<tr>\n<td>IP reputation</td>\n<td>Repeated automated requests from one IP degrade its reputation.</td>\n</tr>\n</tbody></table>\n<h3>The fix — three layers of defense</h3>\n<p><strong>Layer 1: Chrome launch flags</strong> (<code>scripts/vnc-driver.js</code>):</p>\n<pre><code class=\"language-js\">args: [\n  &#39;--disable-blink-features=AutomationControlled&#39;,  // removes navigator.webdriver\n  &#39;--disable-infobars&#39;,                              // removes &quot;controlled by automation&quot; banner\n  &#39;--no-default-browser-check&#39;,                      // avoids first-run prompts\n]\n</code></pre>\n<p>The critical flag is <strong><code>--disable-blink-features=AutomationControlled</code></strong>.\nWithout it, Chrome sets <code>navigator.webdriver = true</code> when launched via CDP.</p>\n<p><strong>Layer 2: <code>addInitScript</code> stealth injection</strong> (runs before any page script):</p>\n<pre><code class=\"language-js\">// In scripts/vnc-driver.js:\nawait context.addInitScript(() =&gt; {\n  Object.defineProperty(navigator, &#39;webdriver&#39;, { get: () =&gt; false });\n  Object.defineProperty(Navigator.prototype, &#39;plugins&#39;, { get: () =&gt; [1,2,3,4,5] });\n  Object.defineProperty(Navigator.prototype, &#39;languages&#39;, { get: () =&gt; [&#39;en-US&#39;,&#39;en&#39;] });\n});\n</code></pre>\n<p><strong>Layer 3: Human-like pacing in automation scripts</strong>:</p>\n<pre><code class=\"language-js\">const humanDelay = () =&gt; sleep(2000 + Math.random() * 3000);   // 2-5 seconds\nconst jobDelay   = () =&gt; sleep(10000 + Math.random() * 10000); // 10-20 seconds\n\n// After every page.goto() and before every form submission:\nawait humanDelay();\n// Between distinct operations (e.g. posting different jobs):\nawait jobDelay();\n</code></pre>\n<h3>CAPTCHA detection &amp; pause-for-manual-solve</h3>\n<p>Even with all the above, Cloudflare may still throw a CAPTCHA. The\nrecommended pattern is to <strong>detect</strong> it and <strong>pause</strong> for manual\nresolution via VNC:</p>\n<pre><code class=\"language-js\">async function waitForCaptcha(page, timeoutSec = 120) {\n  const start = Date.now();\n  while (Date.now() - start &lt; timeoutSec * 1000) {\n    const title = await page.title();\n    const text = await page.evaluate(() =&gt; document.body?.innerText || &#39;&#39;);\n    if (title.includes(&#39;moment&#39;) || title.includes(&#39;Verification&#39;) ||\n        text.includes(&#39;Verify you are human&#39;)) {\n      console.log(&#39;CAPTCHA detected! Solve via VNC viewer.&#39;);\n      await sleep(5000);\n      continue;\n    }\n    return true;\n  }\n  return false;\n}\n</code></pre>\n<p>Call this after every <code>page.goto()</code>. While waiting, open the VNC viewer\nand click the Cloudflare checkbox by hand. The script detects the page\nchange and resumes automatically.</p>\n<h3>When Cloudflare blocks you anyway</h3>\n<ol>\n<li><strong>Wait 10–15 minutes</strong> — the block is partially time-based.</li>\n<li><strong>Clear cookies</strong>: <code>rm -rf ./profile/Default/Cookies*</code> then restart VNC.</li>\n<li><strong>Fresh profile</strong>: <code>PROFILE=/tmp/fresh-profile npm run vnc</code></li>\n<li><strong>Residential proxy</strong> — if the IP is flagged, no browser-level stealth helps.</li>\n<li><strong>Reduce frequency</strong> — post 5 jobs, wait 30 minutes, post 5 more.</li>\n</ol>\n<hr>\n<h2>Tuning the stealth layer</h2>\n<p>The patches live in <code>stealth.js</code>. Each one is in a small section\nlabeled <code>// ---- N. &lt;signal&gt; ----</code>. To disable a patch (for testing),\nwrap it in <code>if (false) { ... }</code> and re-run. To add a new patch, add\nit to the same file and it will be picked up automatically (no\nre-import needed — it&#39;s loaded once on launch).</p>\n<p>If you upgrade Chrome, update the <code>CHROME_VERSION</code> constant at the\ntop of <code>headless.js</code> so the synthetic User-Agent matches the real\none. Otherwise some sites will see a Chrome-140 UA on a Chrome-150\nbinary and flag the mismatch.</p>\n","headings":[]},{"name":"troubleshooting","file":"troubleshooting.md","html":"<h1>Troubleshooting</h1>\n<p>Common problems and their fixes.</p>\n<hr>\n<h2>&quot;Failed to launch Google Chrome&quot;</h2>\n<pre><code>Error: Failed to launch Google Chrome. Is it installed at /usr/bin/google-chrome?\nOriginal error: browserType.launchPersistentContext: ...\n</code></pre>\n<p><strong>Cause:</strong> Either Google Chrome isn&#39;t at <code>/usr/bin/google-chrome</code>, or\nthe executable can&#39;t be launched in your environment.</p>\n<p><strong>Fixes:</strong></p>\n<ol>\n<li>Check that Chrome exists and is executable:<pre><code class=\"language-bash\">ls -la /usr/bin/google-chrome\ngoogle-chrome --version\n</code></pre>\n</li>\n<li>If it&#39;s at a different path, pass it explicitly:<pre><code class=\"language-bash\">node headless.js --executablePath=/path/to/chrome https://example.com\n</code></pre>\nOr in code:<pre><code class=\"language-js\">await launch({ executablePath: &#39;/snap/bin/chromium&#39;, ... });\n</code></pre>\n</li>\n<li>On a headless server (no display), you may need:<pre><code class=\"language-bash\">sudo apt-get install -y xvfb\n# Then run with xvfb-run:\nxvfb-run node headless.js https://example.com\n</code></pre>\n</li>\n<li>As root inside a container, you may also need <code>--no-sandbox</code> (it&#39;s\nalready in the default args, but if you&#39;ve customized).</li>\n</ol>\n<hr>\n<h2>&quot;Cannot find module &#39;playwright&#39;&quot;</h2>\n<p><strong>Cause:</strong> The <code>node_modules/</code> folder doesn&#39;t have Playwright.</p>\n<p><strong>Fixes:</strong></p>\n<pre><code class=\"language-bash\"># Option 1: install globally\nnpm install -g playwright\n\n# Option 2: install in the project parent\ncd /opt/lampp/htdocs\nnpm install playwright\n\n# Option 3: install in this folder\ncd /opt/lampp/htdocs/ServerBrowser\nnpm install playwright\n</code></pre>\n<p>If you&#39;ve installed globally and <code>require(&#39;playwright&#39;)</code> still fails,\nyour NODE_PATH is wrong:</p>\n<pre><code class=\"language-bash\">NODE_PATH=$(npm root -g) node headless.js https://example.com\n</code></pre>\n<hr>\n<h2>&quot;ECONNREFUSED 127.0.0.1:9222&quot; or &quot;DevTools port not available&quot;</h2>\n<p><strong>Cause:</strong> A previous Chrome process didn&#39;t clean up its DevTools\nport, OR two <code>headless.js</code> instances are racing on the same profile.</p>\n<p><strong>Fix:</strong></p>\n<pre><code class=\"language-bash\"># Find and kill orphaned Chrome processes\npkill -f &quot;google-chrome.*--remote-debugging&quot;\n\n# Or be more targeted:\nps aux | grep -i chrome | grep -v grep\nkill &lt;pid&gt;\n</code></pre>\n<p>Don&#39;t run two <code>headless.js</code> instances against the same profile at\nthe same time. Use different <code>--profile</code> paths if you need to\nparallelize.</p>\n<hr>\n<h2>Screenshot is &quot;missing&quot; / &quot;blank&quot; / a half-loaded page</h2>\n<p><strong>Cause:</strong> The page didn&#39;t have time to render before the screenshot.</p>\n<p><strong>Fixes:</strong></p>\n<ol>\n<li>Increase the settle time:<pre><code class=\"language-bash\">node headless.js --shot --screenshot-wait=5000 URL\n</code></pre>\n</li>\n<li>Use a stricter wait condition (the default <code>networkidle</code> is the\nsafest):<pre><code class=\"language-bash\">node headless.js --shot --screenshot-wait-until=networkidle URL\n</code></pre>\n</li>\n<li>If the page is a single-page app that never reaches\n<code>networkidle</code>, use <code>domcontentloaded</code> and a long wait:<pre><code class=\"language-bash\">node headless.js --shot --screenshot-wait-until=domcontentloaded \\\n  --screenshot-wait=8000 URL\n</code></pre>\n</li>\n</ol>\n<hr>\n<h2>Site still flags me as a bot</h2>\n<p>The stealth layer is best-effort. If a site still flags you:</p>\n<ol>\n<li><strong>Check <code>--check</code> first</strong> — see <a href=\"stealth.md\">stealth.md</a> for what\nto look at.</li>\n<li><strong>Try <code>--headed</code></strong> — solve a CAPTCHA once; the cookies persist.</li>\n<li><strong>Switch profiles</strong> — you may have been rate-limited on this IP\nfor this fingerprint combination. A fresh profile starts\nwithout history.</li>\n<li><strong>Add a residential proxy</strong> — outside the scope of this</li>\n</ol>\n<hr>\n<h2>Cloudflare Turnstile keeps throwing CAPTCHAs (VNC session)</h2>\n<p><strong>Cause:</strong> Cloudflare Turnstile detects automation signals even in headed\nmode. The most common triggers are <code>navigator.webdriver = true</code>,\nrapid navigation patterns, or IP reputation.</p>\n<p><strong>Fixes — read the full guide in <a href=\"stealth.md\">stealth.md</a> § &quot;Cloudflare\nTurnstile / CAPTCHA handling&quot;.</strong> Quick version:</p>\n<ol>\n<li><strong>Verify <code>navigator.webdriver</code> is <code>false</code></strong> — this is the #1 signal.\nThe <code>--disable-blink-features=AutomationControlled</code> Chrome flag\nand the <code>addInitScript</code> override in <code>vnc-driver.js</code> should handle it.</li>\n<li><strong>Slow down</strong> — add 2–5 second delays between actions, 10–20 seconds\nbetween jobs. Cloudflare tracks navigation frequency.</li>\n<li><strong>Implement CAPTCHA detection</strong> — detect &quot;Just a moment...&quot; / &quot;Verify\nyou are human&quot; in the page title/text and pause the script for manual\nVNC solve.</li>\n<li><strong>Wait 10–15 minutes</strong> — Cloudflare blocks are partially time-based.</li>\n<li><strong>Clear cookies and restart</strong>: <code>rm -rf ./profile/Default/Cookies*</code></li>\n<li><strong>Fresh profile</strong>: <code>PROFILE=/tmp/fresh-profile npm run vnc</code></li>\n<li><strong>Use a residential proxy</strong> if the IP is flagged. project,\nbut no browser-level stealth can fix a blacklisted IP.</li>\n<li><strong>Slow down</strong> — add longer delays between actions. The <code>human.*</code>\nhelpers&#39; defaults are reasonable for a single user, but if\nyou&#39;re making 50 requests/minute, real users don&#39;t do that.</li>\n</ol>\n<hr>\n<h2>Search returns 0 results</h2>\n<p><strong>Diagnosis:</strong></p>\n<pre><code class=\"language-bash\">node headless.js --search &quot;your query&quot; --search-json | jq &#39;.tried&#39;\n</code></pre>\n<p>You&#39;ll see something like:</p>\n<pre><code class=\"language-json\">[\n  { &quot;engine&quot;: &quot;duckduckgo-html&quot;, &quot;error&quot;: &quot;no results parsed&quot; },\n  { &quot;engine&quot;: &quot;brave&quot;,           &quot;error&quot;: &quot;no results parsed&quot; },\n  { &quot;engine&quot;: &quot;searxng&quot;,         &quot;error&quot;: &quot;page looked blocked&quot; }\n]\n</code></pre>\n<p><strong>Common causes and fixes:</strong></p>\n<ol>\n<li><strong>All engines parsed 0 results</strong> — your query is very unusual or\nnon-Latin. Try a simpler query first to confirm the engines are\nreachable, then debug your specific query.</li>\n<li><strong>SearXNG instance is dead</strong> — public SearXNG instances come and\ngo. Use <code>--searxng-instance=https://searx.be</code> (or another\nfrom <a href=\"https://searx.space\">https://searx.space</a>).</li>\n<li><strong>The CAPTCHA loop on DuckDuckGo</strong> — if your IP has been hitting\nDDG aggressively, you may be seeing a captcha (which our\n<code>healthy()</code> check correctly flags as &quot;page looked blocked&quot;).\nWait a few hours or switch to <code>--search-engine=brave</code>.</li>\n<li><strong>Network restriction</strong> — your firewall or container is\nblocking one or more of the engine hosts. Check with:<pre><code class=\"language-bash\">curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; https://html.duckduckgo.com/html/?q=test\ncurl -s -o /dev/null -w &quot;%{http_code}\\n&quot; https://search.brave.com/search?q=test\n</code></pre>\n</li>\n</ol>\n<hr>\n<h2>Persistent profile is huge (&gt;1 GB)</h2>\n<p><strong>Cause:</strong> Chrome accumulates cache, history, and other state\nindefinitely. Over months of heavy use, the profile can grow.</p>\n<p><strong>Fixes:</strong></p>\n<ol>\n<li>Just delete the profile and start over. You lose all logged-in\nsessions, but everything rebuilds on next run.<pre><code class=\"language-bash\">rm -rf /opt/lampp/htdocs/ServerBrowser/profile/\n</code></pre>\n</li>\n<li>Use separate profiles per project so each one stays small:<pre><code class=\"language-bash\">node headless.js --profile=./profiles/work URL\n</code></pre>\n</li>\n<li>Use a cron job to clean caches while keeping cookies:<pre><code class=\"language-bash\">find /opt/lampp/htdocs/ServerBrowser/profile/Default/Cache -type f -delete\nfind /opt/lampp/htdocs/ServerBrowser/profile/Default/Code\\ Cache -type f -delete\n</code></pre>\n(Don&#39;t touch <code>Cookies</code>, <code>Local Storage</code>, <code>IndexedDB</code>, or\n<code>Preferences</code> — those are your session.)</li>\n</ol>\n<hr>\n<h2>&quot;Cannot read property of undefined&quot; inside the stealth script</h2>\n<p><strong>Cause:</strong> One of the stealth patches is failing on a page that\nshapes its globals unusually.</p>\n<p><strong>Fixes:</strong></p>\n<ol>\n<li>The patches are wrapped in a top-level <code>try/catch</code> so a failure\nshouldn&#39;t crash anything. If you see this error from <em>outside</em>\nthe stealth script, it&#39;s not us.</li>\n<li>To debug, comment out patches one at a time in <code>stealth.js</code> (the\nsections are clearly numbered <code>// ---- N. &lt;signal&gt; ----</code>) and\nsee which one is the offender.</li>\n<li>Report the failure to the project with the URL of the offending\npage and the stack trace.</li>\n</ol>\n<hr>\n<h2>Process won&#39;t exit after the script &quot;finishes&quot;</h2>\n<p><strong>Cause:</strong> A timer, a CDP session, or a long-running <code>human.*</code>\npromise is still alive.</p>\n<p><strong>Fixes:</strong></p>\n<ol>\n<li>Make sure you call <code>close()</code> at the end of your script:<pre><code class=\"language-js\">const { close } = await launch(...);\n// ... do stuff ...\nawait close();\n</code></pre>\n</li>\n<li>If you&#39;ve been using <code>--keep-open</code> and exited with Ctrl+C in\nthe middle, the Chrome process may be orphaned. Kill it:<pre><code class=\"language-bash\">pkill -f &quot;google-chrome&quot;\n</code></pre>\n</li>\n<li>As a last resort, force exit at the end of your script:<pre><code class=\"language-js\">await close();\nprocess.exit(0);\n</code></pre>\n</li>\n</ol>\n<hr>\n<h2>Screenshot says &quot;saved 0 bytes&quot;</h2>\n<p><strong>Cause:</strong> Playwright tried to write a screenshot but the page\ncrashed or the buffer is empty.</p>\n<p><strong>Fixes:</strong></p>\n<ol>\n<li>Open the page first and check for console errors:<pre><code class=\"language-js\">const { page, close } = await launch({ url });\npage.on(&#39;pageerror&#39;, e =&gt; console.error(&#39;Page error:&#39;, e));\nawait page.waitForTimeout(2000);\nawait screenshot(&#39;foo.png&#39;);\nawait close();\n</code></pre>\n</li>\n<li>Try a different <code>waitUntil</code>:<pre><code class=\"language-bash\">--screenshot-wait-until=load\n</code></pre>\n</li>\n<li>The page may have a long-running request that never resolves;\ntry <code>--screenshot-wait=100</code> (a tiny manual wait) to capture\nwhatever is on screen.</li>\n</ol>\n<hr>\n<h2>&quot;permission denied&quot; when launching Chrome</h2>\n<p><strong>Cause:</strong> Running as a non-root user that can&#39;t write to the\nprofile dir, or the profile is owned by another user.</p>\n<p><strong>Fixes:</strong></p>\n<pre><code class=\"language-bash\"># Take ownership\nsudo chown -R $(whoami) /opt/lampp/htdocs/ServerBrowser/profile/\n\n# Or pick a profile you can write to\nnode headless.js --profile=$HOME/.browser-profile-me URL\n</code></pre>\n<hr>\n<h2>Page says &quot;Please enable JavaScript&quot;</h2>\n<p><strong>Cause:</strong> Either JavaScript is disabled (it isn&#39;t, by default) or\nthe site&#39;s bot detection thinks the user-agent is wrong.</p>\n<p><strong>Fixes:</strong></p>\n<ol>\n<li>Check the UA:<pre><code class=\"language-bash\">node headless.js --check https://example.com | grep userAgent\n</code></pre>\nIt should be a real Chrome 140 UA. If it&#39;s something like\n<code>HeadlessChrome/140...</code>, your stealth init script isn&#39;t loading.</li>\n<li>Confirm <code>addInitScript</code> is being called (it is, in <code>headless.js</code>\nline ~135) and that the <code>stealth.js</code> module loads without\nthrowing.</li>\n</ol>\n<hr>\n<h2>Search engine returns the same captcha page every time</h2>\n<p><strong>Cause:</strong> Your IP is on a captcha list for that engine. The\nfallback chain is supposed to handle this, but if ALL three engines\ncaptcha you, you need to:</p>\n<ol>\n<li>Wait a few hours and try again.</li>\n<li>Use a different network (mobile hotspot, residential proxy, VPN).</li>\n<li>Use a different machine.</li>\n</ol>\n<p>This is a network-level block; the stealth layer can&#39;t help here.</p>\n<hr>\n<h2>Still stuck?</h2>\n<ol>\n<li>Run with <code>--headed</code> and watch what the browser does.</li>\n<li>Use Chrome DevTools (right-click → Inspect) while the page is\nopen to see the JS console.</li>\n<li>Look at <code>PLAYWRIGHT--script.log</code> (in the parent <code>/opt/lampp/htdocs</code>\nfolder — your other Playwright scripts write there).</li>\n<li>Check the <code>tried</code> field in a search response — it tells you\nexactly which engines failed and why.</li>\n</ol>\n","headings":[]}];
    const tree = document.getElementById('tree');
    const page = document.getElementById('page');

    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    sections.forEach((sec, idx) => {
      const li = document.createElement('li');
      const item = document.createElement('div');
      item.className = 'item';
      const chevron = document.createElement('span');
      chevron.className = 'chevron';
      chevron.textContent = '▶';
      const label = document.createElement('span');
      label.textContent = sec.name;
      item.appendChild(chevron);
      item.appendChild(label);

      const children = document.createElement('ul');
      children.className = 'children';

      const hasHeadings = sec.headings && sec.headings.length > 0;
      if (hasHeadings) {
        sec.headings.forEach(h => {
          const leaf = document.createElement('li');
          const a = document.createElement('div');
          a.className = 'leaf';
          a.textContent = h.text;
          a.dataset.section = sec.name;
          a.dataset.anchor = h.id;
          a.addEventListener('click', () => {
            loadSection(sec.name, h.id);
            document.querySelectorAll('.tree .item').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.tree .leaf').forEach(x => x.classList.remove('active'));
            a.classList.add('active');
          });
          leaf.appendChild(a);
          children.appendChild(leaf);
        });
      }

      item.addEventListener('click', () => {
        const isOpen = children.classList.contains('open');
        if (isOpen) {
          children.classList.remove('open');
          chevron.classList.remove('open');
        } else {
          children.classList.add('open');
          chevron.classList.add('open');
        }
        if (!isOpen) {
          loadSection(sec.name);
          document.querySelectorAll('.tree .item').forEach(x => x.classList.remove('active'));
          document.querySelectorAll('.tree .leaf').forEach(x => x.classList.remove('active'));
          item.classList.add('active');
        }
      });

      li.appendChild(item);
      if (hasHeadings) li.appendChild(children);
      tree.appendChild(li);
    });

    function loadSection(name, anchor) {
      const sec = sections.find(s => s.name === name);
      if (!sec) return;
      const html = sec.html;
      if (anchor) {
        const el = document.createElement('div');
        el.innerHTML = html;
        const target = el.querySelector('#' + anchor);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        page.innerHTML = html;
        history.replaceState(null, '', '#' + anchor);
      } else {
        page.innerHTML = html;
        history.replaceState(null, '', name + '.html');
      }
    }

    // Load from hash
    function loadFromHash() {
      const hash = location.hash.replace('#', '');
      if (!hash) return;
      const [name, anchor] = hash.split('/');
      if (name && sections.find(s => s.name === name)) {
        loadSection(name, anchor);
      }
    }

    window.addEventListener('hashchange', loadFromHash);
    loadFromHash();
  </script>
