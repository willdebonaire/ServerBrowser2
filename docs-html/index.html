et <code>401</code> +\n<code>WWW-Authenticate: Basic realm=&quot;ServerBrowser&quot;</code>; WebSocket upgrades are refused.</li>\n<li>The password is never printed back — <code>tunnel-url</code> reports <code>passwordProtected</code>\nand <code>passwordSet</code> only.</li>\n</ul>\n<h3>Environment variables</h3>\n<table>\n<thead>\n<tr>\n<th>Variable</th>\n<th>Effect</th>\n<th>Default</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>TUNNEL_PASSWORD</code></td>\n<td>Default password when none is passed</td>\n<td>(none — required)</td>\n</tr>\n<tr>\n<td><code>TUNNEL_TARGET</code></td>\n<td>Default local target</td>\n<td><code>http://127.0.0.1:6080</code></td>\n</tr>\n<tr>\n<td><code>TUNNEL_PROXY_PORT</code></td>\n<td>Port of the local password gate</td>\n<td><code>6199</code></td>\n</tr>\n<tr>\n<td><code>TUNNEL_CUSTOM_URL</code></td>\n<td>Public URL for the <code>custom</code> provider</td>\n<td>(none)</td>\n</tr>\n<tr>\n<td><code>TUNNEL_URL_TIMEOUT_MS</code></td>\n<td>How long to wait for a provider URL</td>\n<td><code>30000</code></td>\n</tr>\n<tr>\n<td><code>TUNNEL_DEBUG_LOG</code></td>\n<td>Append the gate&#39;s stdout/stderr to this file</td>\n<td>(off)</td>\n</tr>\n</tbody></table>\n<h3>Examples</h3>\n<pre><code class=\"language-bash\"># Password-gated tunnel in front of the noVNC page (custom = bring your own)\nnode scripts/tunnel.js tunnel-create my-session s3cret custom\nnode scripts/tunnel.js tunnel-route http://127.0.0.1:6080 custom\nnode scripts/tunnel.js tunnel-url custom\nnode scripts/tunnel.js tunnel-status custom\nnode scripts/tunnel.js tunnel-stop custom\n\n# Cloudflare quick tunnel (needs cloudflared installed)\nnode scripts/tunnel.js tunnel-create my-session s3cret cloudflare\n</code></pre>\n<h3>Security notes</h3>\n<ul>\n<li>Always set a password; the gate refuses to start without one.</li>\n<li>The provider is validated <strong>before</strong> the shared gate is touched, so a failed\n<code>cloudflare</code> start can never disturb a running <code>custom</code> tunnel.</li>\n<li>Do not expose the raw CDP port (9222) or the gate&#39;s own port directly.</li>\n<li><code>datastore/tunnel-state.json</code> holds the gate password and is written <code>0600</code>.</li>\n</ul>\n<h3>Plan for own tunnel service launch</h3>\n<p><code>tunnel.js</code> already isolates the provider behind <code>resolveProvider(name)</code>. A\nfuture phase can add a <code>tunnel-service/</code> module (multi-client session\nmanagement, timeouts, a control plane for lifecycle) without touching the\ncommands above.</p>\n<hr>\n<h2>11. Standalone app</h2>\n<p><code>standalone/</code> is a thin, scriptable CLI in front of the same engines: the browser\ngroup delegates to <code>scripts/live.js</code>, the tunnel group to <code>scripts/tunnel.js</code>,\nand the AI group to the provider layer in <code>standalone/providers/</code>.</p>\n<h3>Setup</h3>\n<pre><code class=\"language-bash\">node standalone/index.js --help      # or: npm run standalone -- --help\nnode standalone/index.js browser     # list that group&#39;s subcommands\n</code></pre>\n<h3>Groups</h3>\n<table>\n<thead>\n<tr>\n<th>Group</th>\n<th>Subcommands</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>browser</code></td>\n<td><code>goto</code>, <code>click</code>, <code>fill</code>, <code>dump</code>, <code>screenshot</code>, <code>pdf</code>, <code>extract-*</code>, <code>save-page-json</code>, <code>screenshot-element</code>, <code>status-set</code>, <code>progress</code>, <code>notify</code>, <code>overlay-state</code>, <code>pause</code>, <code>resume</code>, <code>agent-tab-*</code>, <code>context-*</code>, <code>db-*</code></td>\n</tr>\n<tr>\n<td><code>tunnel</code></td>\n<td><code>create</code>, <code>route</code>, <code>url</code>, <code>status</code>, <code>stop</code></td>\n</tr>\n<tr>\n<td><code>ai</code></td>\n<td><code>providers</code>, <code>ping</code>, <code>chat</code></td>\n</tr>\n<tr>\n<td><code>api-keys</code></td>\n<td><code>set</code>, <code>get</code>, <code>list</code>, <code>remove</code>, <code>path</code></td>\n</tr>\n</tbody></table>\n<h3>Commands</h3>\n<pre><code class=\"language-bash\"># Browser automation (delegates to scripts/live.js)\nnode standalone/index.js browser goto https://example.com\nnode standalone/index.js browser click &quot;button#submit&quot;\nnode standalone/index.js browser extract-links checkout\nnode standalone/index.js browser db-select products &#39;{&quot;id&quot;:1}&#39;\n\n# Tunnels with password-protected ingress\nnode standalone/index.js tunnel create my-session s3cret custom\nnode standalone/index.js tunnel status custom\nnode standalone/index.js tunnel stop custom\n\n# API keys — stored 0600 in ~/.config/serverbrowser/api-keys.json\nnode standalone/index.js api-keys set anthropic sk-ant-abc123\nnode standalone/index.js api-keys get anthropic            # masked\nnode standalone/index.js api-keys get anthropic --reveal   # raw, on purpose\nnode standalone/index.js api-keys list\nnode standalone/index.js api-keys remove anthropic\n\n# AI calls through the provider layer\nnode standalone/index.js ai providers                      # which keys are available\nnode standalone/index.js ai ping                           # offline round trip\nnode standalone/index.js ai chat echo &quot;summarise this&quot;     # no credentials needed\nnode standalone/index.js ai chat openai &quot;summarise this&quot; --model gpt-4o-mini\n</code></pre>\n<h3>API key storage</h3>\n<p>Keys live in <code>~/.config/serverbrowser/api-keys.json</code> with the directory at <code>0700</code>\nand the file at <code>0600</code>; they are never written into the repository. <code>get</code>/<code>list</code>\nmask the value unless you pass <code>--reveal</code>.</p>\n<h3>AI provider abstraction</h3>\n<p><code>standalone/providers/ai.js</code> gives every provider the same call shape\n(<code>chat({ prompt, system, model, maxTokens, temperature })</code> → <code>{ text, usage }</code>):</p>\n<table>\n<thead>\n<tr>\n<th>Provider</th>\n<th>Credentials</th>\n<th>Base URL override</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>echo</code></td>\n<td>none (offline, deterministic)</td>\n<td>—</td>\n</tr>\n<tr>\n<td><code>openai</code></td>\n<td><code>OPENAI_API_KEY</code> or the key store</td>\n<td><code>OPENAI_BASE_URL</code></td>\n</tr>\n<tr>\n<td><code>anthropic</code></td>\n<td><code>ANTHROPIC_API_KEY</code> or the key store</td>\n<td><code>ANTHROPIC_BASE_URL</code></td>\n</tr>\n<tr>\n<td><code>ollama</code></td>\n<td>none</td>\n<td><code>OLLAMA_URL</code></td>\n</tr>\n</tbody></table>\n<p>A missing key fails immediately with an actionable message instead of a 401 deep\ninside <code>fetch</code>. Adding a provider means adding one object with <code>name</code>,\n<code>requiresKey</code> and <code>chat()</code> to <code>PROVIDERS</code>.</p>\n<h3>Integrating with live.js</h3>\n<p>The standalone browser group forks <code>scripts/live.js</code> per command, so results are\nthe same JSON lines and every <code>live.js</code> command is available — including the\nscraping, overlay and datastore commands.</p>\n<h2>12. Troubleshooting</h2>\n<ul>\n<li><strong>Ports in use:</strong> override them, e.g. <code>CDP_PORT=9223 WEB_PORT=6081 npm run vnc</code>,\nand pass the matching <code>CDP_URL</code> to <code>live</code>/<code>live-run</code>.</li>\n<li><strong>&quot;Profile is in use&quot;</strong> when starting: another Chrome is holding <code>profile/</code>.\nClose it, or point to a fresh one with <code>PROFILE=/tmp/chrome-alt npm run vnc</code>.</li>\n<li><strong>Can&#39;t attach:</strong> confirm <code>curl http://127.0.0.1:9222/json/version</code> responds\nwhile <code>npm run vnc</code> is running.</li>\n<li><strong>Stored script still closes the browser:</strong> only <code>browser.close()</code> is\nsuppressed. If a script calls it via a different name/path, run it through\n<code>live-run</code> (which patches the shared Playwright singleton that the script\nimports) rather than requiring it directly.</li>\n<li><strong>Local Chrome not detected:</strong> start Chrome with <code>--remote-debugging-port=9222</code>\nand verify with <code>curl http://127.0.0.1:9222/json/version</code>. If another\nprocess uses that port, try 9223 or 9224, or point at it explicitly with\n<code>npm run local-chrome -- 9444</code> / <code>node scripts/local-chrome.js detect 9444</code>.</li>\n<li><strong>No HUD on the VNC screen:</strong> the driver logs a self-check line —\n<code>[driver] self-check: {&quot;stealth&quot;:…,&quot;overlayConfig&quot;:…,&quot;overlayApi&quot;:…,&quot;hud&quot;:…}</code>.\nIf <code>hud</code> is <code>false</code>, the injected script failed to parse; <code>overlay-state</code>\nreports the same thing from the agent side.</li>\n<li><strong><code>status-set</code> / <code>progress</code> / <code>notify</code> return <code>ok</code> but nothing appears:</strong> they\nare no-ops when the HUD is not installed. Check <code>overlay-state</code> first, and\nreload the page (<code>goto</code>) so the init script runs.</li>\n<li><strong>Tunnel answers 401:</strong> every request needs the password — <code>curl -u any:PW …</code>\nor <code>…?pw=PW</code>. For noVNC, open the viewer with <code>?pw=…</code> in the URL; the cookie\nis then set for the page&#39;s own assets.</li>\n<li><strong><code>tunnel-create</code> says <code>cloudflared not found</code>:</strong> install the provider binary\n(the error links to the download) or use <code>--provider custom</code> with\n<code>TUNNEL_CUSTOM_URL</code> set.</li>\n<li><strong><code>db-*</code> says nothing is connected:</strong> the datastore connects lazily; pass\n<code>DATASTORE_PATH</code> or use <code>db-connect &lt;path&gt;</code> to choose a file.</li>\n</ul>\n","headings":[]},{"name":"api","file":"api.md","html":"<h1>Library API</h1>\n<p>Every feature is exposed as a JavaScript function. The CLI is just a\nthin wrapper over these.</p>\n<pre><code class=\"language-js\">const {\n  launch,           // async function: opens a stealth headless Chrome\n  makeHumanizer,    // (advanced) build a humanizer for an arbitrary page\n  search,           // async function: one-shot web search\n  screenshot,       // (returned by launch; not exported standalone)\n  formatResults,    // (re-exported from search.js) pretty-print results\n  ENGINES,          // registry of search engines\n  ENGINE_ALIASES,   // [&#39;duckduckgo-html&#39;, &#39;ddg&#39;, &#39;brave&#39;, &#39;searxng&#39;]\n  DEFAULT_ENGINE,   // &#39;duckduckgo-html&#39;\n  FALLBACK_CHAIN,   // [&#39;duckduckgo-html&#39;, &#39;brave&#39;, &#39;searxng&#39;]\n  REAL_UA,          // the User-Agent the browser presents\n  DEFAULT_PROFILE,  // default profile dir (./profile)\n} = require(&#39;./headless&#39;);\n</code></pre>\n<hr>\n<h2><code>launch(opts)</code> → <code>Promise&lt;LaunchResult&gt;</code></h2>\n<p>Launch a persistent stealth context. The returned object gives you\nthe page, the context, helpers, and a <code>close()</code> function.</p>\n<h3>Signature</h3>\n<pre><code class=\"language-js\">const result = await launch({\n  url:                  &#39;https://example.com&#39;,   // optional: auto-navigate\n  profileDir:           &#39;./profile&#39;,             // optional, default\n  headless:             true,                    // default\n  noHeadless:           false,                   // mutually exclusive\n  keepOpen:             false,                   // don&#39;t auto-close\n  viewport:             { width: 1920, height: 1080 },\n  locale:               &#39;en-US&#39;,\n  timezoneId:           &#39;America/New_York&#39;,\n  geolocation:          { latitude: 40.7, longitude: -74.0 },\n  userAgent:            REAL_UA,                 // override\n  executablePath:       &#39;/usr/bin/google-chrome&#39;,\n\n  // Auto-screenshot (taken once, after the URL settles):\n  screenshot:           false,\n  screenshotPath:       &#39;./screenshots/foo.png&#39;,  // optional\n  screenshotFullPage:   false,\n  screenshotFormat:     &#39;png&#39;,                    // &#39;png&#39; | &#39;jpeg&#39;\n  screenshotQuality:    80,                       // jpeg only\n  screenshotWaitUntil:  &#39;networkidle&#39;,\n  screenshotWait:       1500,\n});\n\nresult = {\n  context,                 // the BrowserContext (= the persistent profile)\n  page,                    // the default Page\n  browser,                 // same as context (alias)\n  human,                   // { wait, pause, think, hover, click, type }\n  close,                   // () =&gt; Promise&lt;void&gt;: shut down the browser\n  screenshot,              // (filePath?, opts?) =&gt; Promise&lt;string&gt;: capture\n  lastScreenshotPath,      // getter: most recent file written\n};\n</code></pre>\n<h3>Options</h3>\n<table>\n<thead>\n<tr>\n<th>Option</th>\n<th>Type</th>\n<th>Default</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>url</code></td>\n<td><code>string</code></td>\n<td>—</td>\n<td>If set, the page auto-navigates to this URL on launch.</td>\n</tr>\n<tr>\n<td><code>profileDir</code></td>\n<td><code>string</code></td>\n<td><code>./profile/</code></td>\n<td>Path to the persistent Chrome user-data dir. Created if missing.</td>\n</tr>\n<tr>\n<td><code>headless</code></td>\n<td><code>boolean</code></td>\n<td><code>true</code></td>\n<td><code>false</code> opens a real Chrome window. Mutually exclusive with <code>noHeadless</code>.</td>\n</tr>\n<tr>\n<td><code>noHeadless</code></td>\n<td><code>boolean</code></td>\n<td><code>false</code></td>\n<td>Convenience alias for <code>headless: false</code>.</td>\n</tr>\n<tr>\n<td><code>keepOpen</code></td>\n<td><code>boolean</code></td>\n<td><code>false</code></td>\n<td>If <code>true</code>, <code>launch()</code> resolves with the browser still running. You must call <code>close()</code> yourself.</td>\n</tr>\n<tr>\n<td><code>viewport</code></td>\n<td><code>{width, height}</code></td>\n<td><code>{1920, 1080}</code></td>\n<td>CSS pixel viewport.</td>\n</tr>\n<tr>\n<td><code>locale</code></td>\n<td><code>string</code></td>\n<td><code>&#39;en-US&#39;</code></td>\n<td>Locale for <code>Accept-Language</code>, <code>navigator.language</code>, etc.</td>\n</tr>\n<tr>\n<td><code>timezoneId</code></td>\n<td><code>string</code></td>\n<td><code>&#39;America/New_York&#39;</code></td>\n<td>IANA timezone id (e.g. <code>&#39;Europe/London&#39;</code>).</td>\n</tr>\n<tr>\n<td><code>geolocation</code></td>\n<td><code>{latitude, longitude}</code></td>\n<td>—</td>\n<td>If set, the browser reports this position. Also grant <code>geolocation</code> permission.</td>\n</tr>\n<tr>\n<td><code>userAgent</code></td>\n<td><code>string</code></td>\n<td><code>REAL_UA</code></td>\n<td>Override the User-Agent. Default is a real Chrome 140 UA matching the installed version.</td>\n</tr>\n<tr>\n<td><code>executablePath</code></td>\n<td><code>string</code></td>\n<td><code>/usr/bin/google-chrome</code></td>\n<td>Override the Chrome binary path.</td>\n</tr>\n</tbody></table>\n<h4>Screenshot options (auto-screenshot on launch)</h4>\n<table>\n<thead>\n<tr>\n<th>Option</th>\n<th>Type</th>\n<th>Default</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>screenshot</code></td>\n<td><code>boolean</code></td>\n<td><code>false</code></td>\n<td>Take a screenshot of the initial URL once it settles.</td>\n</tr>\n<tr>\n<td><code>screenshotPath</code></td>\n<td><code>string</code></td>\n<td>auto-named</td>\n<td>Absolute or relative output path. Format inferred from extension.</td>\n</tr>\n<tr>\n<td><code>screenshotFullPage</code></td>\n<td><code>boolean</code></td>\n<td><code>false</code></td>\n<td>Full scrollable page, not just viewport.</td>\n</tr>\n<tr>\n<td><code>screenshotFormat</code></td>\n<td><code>&#39;png&#39; | &#39;jpeg&#39;</code></td>\n<td><code>&#39;png&#39;</code></td>\n<td>Image format.</td>\n</tr>\n<tr>\n<td><code>screenshotQuality</code></td>\n<td><code>number</code></td>\n<td><code>80</code></td>\n<td>JPEG quality 0-100 (ignored for PNG).</td>\n</tr>\n<tr>\n<td><code>screenshotWaitUntil</code></td>\n<td><code>string</code></td>\n<td><code>&#39;networkidle&#39;</code></td>\n<td>Wait condition before capture: <code>load</code>, <code>domcontentloaded</code>, <code>networkidle</code>.</td>\n</tr>\n<tr>\n<td><code>screenshotWait</code></td>\n<td><code>number</code></td>\n<td><code>1500</code></td>\n<td>Extra ms to wait AFTER the wait condition resolves. Use to let lazy content settle.</td>\n</tr>\n</tbody></table>\n<h3>Return value</h3>\n<pre><code class=\"language-ts\">type LaunchResult = {\n  context: import(&#39;playwright&#39;).BrowserContext;\n  page:    import(&#39;playwright&#39;).Page;\n  browser: import(&#39;playwright&#39;).BrowserContext;  // alias\n  human:   {\n    wait:  (ms?: number) =&gt; Promise&lt;void&gt;;\n    pause: () =&gt; Promise&lt;void&gt;;\n    think: () =&gt; Promise&lt;void&gt;;\n    hover: (selector: string) =&gt; Promise&lt;void&gt;;\n    click: (selector: string, opts?: object) =&gt; Promise&lt;void&gt;;\n    type:  (selector: string, text: string) =&gt; Promise&lt;void&gt;;\n  };\n  close:                  () =&gt; Promise&lt;void&gt;;\n  screenshot:             (target?: string | object, overrides?: object) =&gt; Promise&lt;string&gt;;\n  lastScreenshotPath:     string | null;  // live getter\n};\n</code></pre>\n<h3>Example</h3>\n<pre><code class=\"language-js\">const { launch } = require(&#39;./headless&#39;);\n\nconst { page, human, screenshot, close } = await launch({\n  url: &#39;https://example.com/login&#39;,\n  profileDir: &#39;./profiles/me&#39;,\n  viewport: { width: 1280, height: 800 },\n  timezoneId: &#39;Europe/London&#39;,\n  geolocation: { latitude: 51.5, longitude: -0.12 },\n});\n\nawait human.type(&#39;input[name=email]&#39;,    &#39;me@example.com&#39;);\nawait human.think();\nawait human.type(&#39;input[name=password]&#39;, &#39;hunter2&#39;);\nawait human.pause();\nawait human.click(&#39;button[type=submit]&#39;);\nawait page.waitForLoadState(&#39;networkidle&#39;);\n\nconst out = await screenshot(&#39;logged-in.png&#39;, { fullPage: true });\nconsole.log(&#39;Saved screenshot to&#39;, out);\n\nawait close();\n</code></pre>\n<hr>\n<h2><code>screenshot(filePath?, opts?)</code> → <code>Promise&lt;string&gt;</code></h2>\n<p>Ad-hoc screenshot. Bound to a specific page by the <code>launch()</code> result.</p>\n<h3>Signatures</h3>\n<pre><code class=\"language-js\">// 1. Auto-name under ./screenshots/, defaults\nconst p1 = await screenshot();\n\n// 2. Explicit path; format inferred from extension\nconst p2 = await screenshot(&#39;foo.png&#39;);\nconst p3 = await screenshot(&#39;bar.jpg&#39;);\n\n// 3. Options object (any Playwright screenshot options)\nconst p4 = await screenshot({ path: &#39;baz.png&#39;, fullPage: true, type: &#39;png&#39; });\nconst p5 = await screenshot({ path: &#39;ele.png&#39;, element: page.locator(&#39;header img&#39;) });\n\n// 4. Path + overrides\nconst p6 = await screenshot(&#39;zoom.png&#39;, { clip: { x: 0, y: 0, width: 800, height: 200 } });\n</code></pre>\n<h3>Options</h3>\n<p>All <a href=\"https://playwright.dev/docs/api/class-page#page-screenshot\">Playwright <code>page.screenshot</code> options</a>\nare supported (<code>path</code>, <code>type</code>, <code>quality</code>, <code>fullPage</code>, <code>clip</code>,\n<code>element</code>, <code>omitBackground</code>, <code>caret</code>, <code>animations</code>, <code>mask</code>, etc.).\nThe helper:</p>\n<ul>\n<li>Resolves the path to an absolute path under <code>./screenshots/</code> if no\npath is given.</li>\n<li>Creates parent directories as needed.</li>\n<li>Infers <code>type</code> from the file extension if you don&#39;t specify it.</li>\n<li>Strips <code>quality</code> for PNG (Playwright throws on PNG+quality).</li>\n<li>Returns the <strong>absolute path</strong> of the file written.</li>\n<li>Updates the <code>lastScreenshotPath</code> getter on the launch result.</li>\n</ul>\n<p>See <a href=\"screenshots.md\">screenshots.md</a> for the conceptual overview.</p>\n<hr>\n<h2><code>human.*</code> — humanization helpers</h2>\n<p>Returned by <code>launch()</code> as <code>result.human</code>. All methods add realistic\ndelays and mouse movement so a watching site can&#39;t tell that the\nactions came from a script.</p>\n<table>\n<thead>\n<tr>\n<th>Method</th>\n<th>Purpose</th>\n<th>Delay pattern</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>human.wait(ms?)</code></td>\n<td>Sleep. If <code>ms</code> is omitted, random 50-250ms.</td>\n<td>uniform</td>\n</tr>\n<tr>\n<td><code>human.pause()</code></td>\n<td>Like reading text.</td>\n<td>300-900ms uniform</td>\n</tr>\n<tr>\n<td><code>human.think()</code></td>\n<td>Like thinking.</td>\n<td>1.2-2.5s uniform</td>\n</tr>\n<tr>\n<td><code>human.hover(sel)</code></td>\n<td>Move mouse to selector with 8-18 sub-steps.</td>\n<td>40-180ms hover dwell</td>\n</tr>\n<tr>\n<td><code>human.click(sel, opts?)</code></td>\n<td>Hover, dwell, then click.</td>\n<td>60-220ms prepre-click + 20-80ms click delay</td>\n</tr>\n<tr>\n<td><code>human.type(sel, text)</code></td>\n<td>Focus, then type each char.</td>\n<td>35-140ms per char, 4% chance of 180-420ms pause between chars</td>\n</tr>\n</tbody></table>\n<h3>Example</h3>\n<pre><code class=\"language-js\">const { launch } = require(&#39;./headless&#39;);\nconst { human, page } = await launch({ url: &#39;https://example.com/login&#39; });\n\nawait human.wait(1500);\nawait human.type(&#39;input[name=email]&#39;,    &#39;me@example.com&#39;);\nawait human.think();\nawait human.type(&#39;input[name=password]&#39;, &#39;hunter2&#39;);\nawait human.pause();\nawait human.click(&#39;button[type=submit]&#39;);\nawait page.waitForLoadState(&#39;networkidle&#39;);\n</code></pre>\n<p>See <a href=\"architecture.md\">architecture.md</a> for the rationale behind the\ndelay distributions.</p>\n<hr>\n<h2><code>search(query, opts?)</code> → <code>Promise&lt;SearchResponse&gt;</code></h2>\n<p>The one-shot search helper. Opens a context, runs the query through\nthe fallback chain, and closes the context.</p>\n<h3>Signature</h3>\n<pre><code class=\"language-js\">const { search, formatResults } = require(&#39;./headless&#39;);\n\nconst r = await search(&#39;node js tutorial&#39;, {\n  engine:           &#39;duckduckgo-html&#39;,  // primary\n  fallback:         [&#39;brave&#39;, &#39;searxng&#39;],  // chain (default = all 3)\n  limit:            10,\n  searxngInstance:  &#39;https://searx.be&#39;,\n  throwOnFail:      false,\n});\n\nr = {\n  query:   &#39;node js tutorial&#39;,\n  engine:  &#39;duckduckgo-html&#39;,  // which engine actually returned\n  results: [\n    { title, url, snippet, position, engine },  // 0..limit-1\n    ...\n  ],\n  tried: [\n    &#39;duckduckgo-html&#39;,  // OR { engine: &#39;brave&#39;, error: &#39;page looked blocked&#39; }\n    ...\n  ],\n}\n</code></pre>\n<h3>Options</h3>\n<table>\n<thead>\n<tr>\n<th>Option</th>\n<th>Type</th>\n<th>Default</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>engine</code></td>\n<td><code>string</code></td>\n<td><code>&#39;duckduckgo-html&#39;</code></td>\n<td>Which engine to try first. One of the keys in <code>ENGINES</code> (or <code>ENGINE_ALIASES</code>).</td>\n</tr>\n<tr>\n<td><code>fallback</code></td>\n<td><code>string[]</code></td>\n<td><code>[&#39;duckduckgo-html&#39;, &#39;brave&#39;, &#39;searxng&#39;]</code></td>\n<td>Engines to try in order, after the primary.</td>\n</tr>\n<tr>\n<td><code>limit</code></td>\n<td><code>number</code></td>\n<td><code>10</code></td>\n<td>Maximum results to return.</td>\n</tr>\n<tr>\n<td><code>searxngInstance</code></td>\n<td><code>string</code></td>\n<td><code>https://paulgo.io</code></td>\n<td>Override the SearXNG instance.</td>\n</tr>\n<tr>\n<td><code>throwOnFail</code></td>\n<td><code>boolean</code></td>\n<td><code>false</code></td>\n<td>If <code>true</code>, throw an <code>Error</code> when all engines fail. Otherwise return an empty <code>results</code> array.</td>\n</tr>\n<tr>\n<td><code>profileDir</code></td>\n<td><code>string</code></td>\n<td>default</td>\n<td>Profile to use for the one-shot context.</td>\n</tr>\n</tbody></table>\n<h3>Result shape</h3>\n<pre><code class=\"language-ts\">type SearchResult = {\n  title:    string;\n  url:      string;\n  snippet?: string;\n  engine:   string;    // which engine returned this\n  position: number;    // 1-based\n};\n\ntype SearchResponse = {\n  query:   string;\n  engine:  string | null;     // which engine actually returned\n  results: SearchResult[];\n  tried:   Array&lt;string | { engine: string; error: string }&gt;;\n};\n</code></pre>\n<h3>Examples</h3>\n<pre><code class=\"language-js\">// Quick one-shot\nconst r = await search(&#39;playwright tutorial&#39;, { limit: 5 });\nconsole.log(r.results.map(x =&gt; x.title));\n\n// Pretty-print\nconsole.log(formatResults(r));\n\n// Force a specific engine\nconst brave = await search(&#39;rust async&#39;, { engine: &#39;brave&#39; });\n\n// Manual context (so you can chain searches sharing cookies)\nconst { launch } = require(&#39;./headless&#39;);\nconst { context, close } = await launch({ profileDir: &#39;./profiles/me&#39; });\ntry {\n  const r1 = await contextSearch(context, &#39;first query&#39;);\n  const r2 = await contextSearch(context, &#39;second query&#39;);\n} finally {\n  await close();\n}\n\n// (Where `contextSearch` is just `require(&#39;./search&#39;).search`)\n</code></pre>\n<p>See <a href=\"search.md\">search.md</a> for the full per-engine details.</p>\n<hr>\n<h2><code>formatResults(r, opts?)</code> → <code>string</code></h2>\n<p>Pretty-print a <code>SearchResponse</code> to a string. Useful for CLI output\nand logging.</p>\n<table>\n<thead>\n<tr>\n<th>Option</th>\n<th>Type</th>\n<th>Default</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>showUrl</code></td>\n<td><code>boolean</code></td>\n<td><code>true</code></td>\n<td>Include the URL of each result.</td>\n</tr>\n<tr>\n<td><code>showSnippet</code></td>\n<td><code>boolean</code></td>\n<td><code>true</code></td>\n<td>Include the snippet of each result.</td>\n</tr>\n</tbody></table>\n<p>Example output:</p>\n<pre><code>Search: playwright tutorial  (engine: duckduckgo-html, 5 results)\n  1. Playwright Python Tutorial\n     https://www.browserstack.com/guide/playwright-python\n     Learn how to use Playwright with Python...\n  2. ...\n</code></pre>\n<hr>\n<h2><code>makeHumanizer(page)</code> → <code>Humanizer</code></h2>\n<p>For advanced use only: if you have a <code>Page</code> from some other source\n(e.g. you&#39;ve opened a second page in the same context), you can build\na humanizer for it directly:</p>\n<pre><code class=\"language-js\">const { launch, makeHumanizer } = require(&#39;./headless&#39;);\nconst { context, close } = await launch();\nconst page = await context.newPage();\nconst human = makeHumanizer(page);\nawait human.type(&#39;input[name=q]&#39;, &#39;playwright&#39;);\nawait page.close();\nawait close();\n</code></pre>\n<hr>\n<h2>Constants</h2>\n<table>\n<thead>\n<tr>\n<th>Export</th>\n<th>Value</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>REAL_UA</code></td>\n<td><code>Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0.0 Safari/537.36</code></td>\n<td>The User-Agent the browser presents. Update <code>CHROME_VERSION</code> in <code>headless.js</code> when you upgrade Chrome.</td>\n</tr>\n<tr>\n<td><code>DEFAULT_PROFILE</code></td>\n<td><code>&lt;this folder&gt;/profile</code></td>\n<td>The default <code>profileDir</code> for <code>launch()</code> and <code>search()</code>.</td>\n</tr>\n<tr>\n<td><code>DEFAULT_ENGINE</code></td>\n<td><code>&#39;duckduckgo-html&#39;</code></td>\n<td>Default primary search engine.</td>\n</tr>\n<tr>\n<td><code>FALLBACK_CHAIN</code></td>\n<td><code>[&#39;duckduckgo-html&#39;, &#39;brave&#39;, &#39;searxng&#39;]</code></td>\n<td>Default search fallback order.</td>\n</tr>\n<tr>\n<td><code>ENGINES</code></td>\n<td><code>{ &#39;duckduckgo-html&#39;: {...}, &#39;brave&#39;: {...}, &#39;searxng&#39;: {...} }</code></td>\n<td>Registry of search engines. Each has <code>name</code>, <code>buildUrl()</code>, <code>extract()</code>, <code>healthy()</code>, <code>waitUntil</code>, <code>waitForSelector</code>, <code>waitMs</code>.</td>\n</tr>\n<tr>\n<td><code>ENGINE_ALIASES</code></td>\n<td><code>[&#39;duckduckgo-html&#39;, &#39;ddg&#39;, &#39;brave&#39;, &#39;searxng&#39;]</code></td>\n<td>Valid engine names for <code>opts.engine</code>.</td>\n</tr>\n</tbody></table>\n","headings":[]},{"name":"architecture","file":"architecture.md","html":"<h1>Architecture</h1>\n<p>How the four source files fit together.</p>\n<h2>File map</h2>\n<pre><code>                ┌─────────────────────────────────────────────┐\n                │              headless.js                    │\n                │  (CLI entry, launch(), search(), etc.)      │\n                │                                             │\n                │   ┌─────────────┐    ┌──────────────────┐  │\n                │   │  stealth.js │    │    search.js      │  │\n                │   │  (init      │    │  (engine          │  │\n                │   │   script)   │    │   registry +      │  │\n                │   │             │    │   extractors)     │  │\n                │   └─────────────┘    └──────────────────┘  │\n                │         │                      │           │\n                └─────────┼──────────────────────┼───────────┘\n                           ▼                      ▼\n                   addInitScript()         search(context, ...)\n                           │                      │\n                           ▼                      ▼\n               ┌─────────────────────────────────────────────┐\n               │  Playwright (chromium.launchPersistentContext)│\n               │  → real Google Chrome at /usr/bin/google-chrome│\n               │  → persistent profile at ./profile/          │\n               └─────────────────────────────────────────────┘\n                                    │\n                                    ▼\n                           (a real browser)\n</code></pre>\n<h2><code>headless.js</code> — the conductor</h2>\n<ul>\n<li><strong>Entry point</strong> for both the CLI and the library.</li>\n<li>Owns the <code>launchPersistentContext</code> call and the configuration of\nthe browser (viewport, locale, UA, launch flags).</li>\n<li><strong>Injects <code>stealth.js</code></strong> as an init script before any page script\nruns.</li>\n<li>Returns a <code>LaunchResult</code> containing the page, the context, the\n<code>human</code> helper, the <code>screenshot</code> helper, and a <code>close()</code> function.</li>\n<li>Exposes a high-level <code>search()</code> that internally calls\n<code>launch()</code> + <code>SEARCH_MODULE.search()</code> + <code>close()</code>.</li>\n<li>Hosts the CLI argument parser and <code>--help</code> text.</li>\n</ul>\n<p>It is <strong>the only file that should be <code>require()</code>d by external\ncode</strong>; everything else is implementation detail.</p>\n<h2><code>stealth.js</code> — the patches</h2>\n<ul>\n<li>A single function: <code>STEALTH_INIT()</code>.</li>\n<li>When called inside a page, it patches <code>Navigator.prototype</code>,\n<code>Document.prototype</code>, <code>WebGLRenderingContext.prototype</code>,\n<code>WebGL2RenderingContext.prototype</code>, and a few globals\n(<code>window.chrome</code>, <code>navigator.plugins</code>, etc.).</li>\n<li>Loaded by <code>headless.js</code> via <code>browser.addInitScript(STEALTH_INIT)</code>,\nwhich means Playwright injects it as a CDP <code>Page.addScriptToEvaluateOnNewDocument</code>\ncall. The script runs <strong>before</strong> any user-space JavaScript on every\npage load.</li>\n<li>The function is wrapped in a <code>try/catch</code> so a single bad patch\ncan&#39;t break the whole page (and so it never throws during\nfingerprinting tests).</li>\n</ul>\n<h2><code>search.js</code> — the engine registry</h2>\n<ul>\n<li>Each engine is a small object with five fields:<ul>\n<li><code>name</code>: short string id.</li>\n<li><code>buildUrl(query, opts)</code>: returns the search URL.</li>\n<li><code>waitUntil</code>: Playwright <code>waitUntil</code> option.</li>\n<li><code>waitForSelector</code>: optional CSS selector to wait for.</li>\n<li><code>waitMs</code>: extra ms to wait after the selector appears.</li>\n<li><code>healthy(page)</code>: returns false if the page looks blocked.</li>\n<li><code>extract(page)</code>: returns <code>[{title, url, snippet}, ...]</code>.</li>\n</ul>\n</li>\n<li><code>search(context, query, opts)</code>:<ol>\n<li>Iterate through the fallback chain.</li>\n<li>For each engine, open a new page in the context, navigate,\nwait, check <code>healthy()</code>, and <code>extract()</code>.</li>\n<li>If a non-empty result list comes back, return it.</li>\n<li>Otherwise, mark the engine as failed in <code>tried</code> and try the\nnext one.</li>\n</ol>\n</li>\n<li><code>formatResults(r)</code>: pretty-printer.</li>\n<li><code>ENGINES</code> and aliases are exported so external code can introspect\nor extend the registry.</li>\n</ul>\n<h2>How the screenshot feature is wired</h2>\n<p><code>headless.js</code> owns the <code>screenshot()</code> helper. It&#39;s a closure over\nthe <code>page</code> returned by <code>launch()</code>. The lifecycle:</p>\n<pre><code>launch()  ─►  page = ...                  // open\n          ─►  lastScreenshotPath = null    // init\n          ─►  define screenshot()          // closure\n          ─►  if (opts.screenshot)         // auto-screenshot\n                 screenshot(opts.screenshotPath, {...})\n          ─►  return { ..., screenshot, lastScreenshotPath }\n</code></pre>\n<p><code>lastScreenshotPath</code> is a closure variable, exposed via a <strong>getter</strong>\non the return object so the value is always live, even after\ndestructuring.</p>\n<h2>How the humanization feature is wired</h2>\n<p><code>makeHumanizer(page)</code> is a factory that returns an object with six\nmethods. Each one wraps a Playwright call with a delay:</p>\n<table>\n<thead>\n<tr>\n<th>Method</th>\n<th>Wraps</th>\n<th>Adds</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>wait</code></td>\n<td><code>setTimeout</code></td>\n<td>random 50-250ms</td>\n</tr>\n<tr>\n<td><code>pause</code></td>\n<td><code>setTimeout</code></td>\n<td>random 300-900ms</td>\n</tr>\n<tr>\n<td><code>think</code></td>\n<td><code>setTimeout</code></td>\n<td>random 1.2-2.5s</td>\n</tr>\n<tr>\n<td><code>hover</code></td>\n<td><code>page.mouse.move</code></td>\n<td>8-18 sub-steps + 40-180ms dwell</td>\n</tr>\n<tr>\n<td><code>click</code></td>\n<td><code>page.click</code></td>\n<td>hover + 60-220ms pre-click + 20-80ms click delay</td>\n</tr>\n<tr>\n<td><code>type</code></td>\n<td><code>page.keyboard.type</code></td>\n<td>35-140ms per char, 4% chance of 180-420ms between</td>\n</tr>\n</tbody></table>\n<p>The distributions are intentionally <strong>uniform</strong> (not Gaussian) — a\ncumulative distribution of uniform delays looks more like a real\nhuman&#39;s variable attention than a centered Gaussian would, because\nhumans have asymmetric &quot;I&#39;ll just check this quickly&quot; tails.</p>\n<h2>How the search CLI mode is wired</h2>\n<p><code>headless.js</code>&#39;s CLI parser detects <code>--search &quot;QUERY&quot;</code> early and\nshort-circuits to the search block:</p>\n<pre><code>argv has --search?  ─►  launch({ url: &#39;about:blank&#39; })   // no nav\n                     ─►  SEARCH_MODULE.search(ctx, query, opts)\n                     ─►  console.log(formatResults(r))\n                     ─►  if (--search-shot)  navigate + screenshot\n                     ─►  close()\n                     ─►  return  // skip the URL-opening branch\n</code></pre>\n<p>The auto-screenshot for the search mode (<code>--search-shot</code>) re-opens\nthe URL of the engine that succeeded so we can capture the results\npage. This means the screenshot is taken <strong>after</strong> extraction\nfinishes, ensuring the page is fully rendered.</p>\n<h2>Data flow for a typical session</h2>\n<pre><code class=\"language-js\">const { launch, search } = require(&#39;./headless&#39;);\n\nawait launch({ url, screenshot: true, profileDir: &#39;./p&#39; });\n//  │\n//  │  ┌─ chromium.launchPersistentContext(&#39;./p&#39;, { ... })\n//  │  │     │\n//  │  │     ├─ launches /usr/bin/google-chrome with stealth flags\n//  │  │     ├─ injects STEALTH_INIT as addInitScript\n//  │  │     └─ returns BrowserContext + first Page\n//  │  │\n//  │  ├─ if (screenshot) { wait; capture; }\n//  │  │\n//  │  └─ return { page, human, screenshot, close, lastScreenshotPath }\n//  │\n//  └─► user code: human.type(...); human.click(...); etc.\n//  └─► user code: search(ctx, &#39;query&#39;)  → { results, ... }\n//  └─► user code: close()\n</code></pre>\n<h2>Why three files, not one</h2>\n<ul>\n<li><strong><code>stealth.js</code></strong> is logically separate because it runs <strong>inside\nthe page context</strong> (via <code>addInitScript</code>) and is largely\nDOM-typed. Keeping it in its own file makes it easy to\ninspect/audit the patches without scrolling past 600 lines of\nNode.js code.</li>\n<li><strong><code>search.js</code></strong> is separate because the engine registry is the\nmost likely thing to change (engines come and go, scrapers\nbreak). Keeping it isolated means you can update just that file\nwhen an engine&#39;s HTML changes.</li>\n<li><strong><code>headless.js</code></strong> is the orchestrator. It imports the other two\nand the Playwright API.</li>\n</ul>\n<p>If you want to add a fourth engine, add it to <code>search.js</code> only.\nIf you want to add a sixth stealth patch, add it to <code>stealth.js</code>\nonly. If you want to add a new CLI flag, add it to <code>headless.js</code>\nonly.</p>\n","headings":[]},{"name":"cli","file":"cli.md","html":"<h1>CLI reference</h1>\n<p>The CLI entry point is <code>headless.js</code>. Run <code>node headless.js --help</code> for\nthe in-tool summary, or read the full reference below.</p>\n<pre><code>node headless.js [flags] [URL]                          # open URL\nnode headless.js --search &quot;my query&quot;                    # search the web\nnode headless.js --search &quot;my query&quot; --search-shot      # search + screenshot\nnode headless.js --check https://bot.sannysoft.com      # fingerprint check\n</code></pre>\n<hr>\n<h2>URL modes (mutually exclusive)</h2>\n<p>The CLI has three top-level modes. Whichever flag appears first in\nthe command line wins; the others are ignored for the same run.</p>\n<table>\n<thead>\n<tr>\n<th>Mode</th>\n<th>Trigger</th>\n<th>What it does</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Open URL</td>\n<td><code>[URL]</code> on the command line</td>\n<td>Navigates to the URL, prints title.</td>\n</tr>\n<tr>\n<td>Search</td>\n<td><code>--search &quot;QUERY&quot;</code></td>\n<td>Web search via the engine fallback chain.</td>\n</tr>\n<tr>\n<td>Fingerprint</td>\n<td><code>--check URL</code></td>\n<td>Loads URL, runs detection probes, prints JSON.</td>\n</tr>\n</tbody></table>\n<p>Examples:</p>\n<pre><code class=\"language-bash\"># Open\nnode headless.js https://example.com\n\n# Search\nnode headless.js --search &quot;playwright tutorial&quot;\n\n# Fingerprint check\nnode headless.js --check https://bot.sannysoft.com\n</code></pre>\n<hr>\n<h2>Other entry points</h2>\n<p><code>headless.js</code> is the one-shot tool. The live/VNC stack has its own commands —\nsee <a href=\"LIVE-DRIVE.md\">LIVE-DRIVE.md</a> for the full reference.</p>\n<table>\n<thead>\n<tr>\n<th>Command</th>\n<th>Does</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>npm run vnc [-- --resolution WxH] [-- --browser chrome|chromium|firefox] [-- --local-chrome]</code></td>\n<td>Bring up Xvfb + headed Chrome + x11vnc + noVNC and stay in the foreground</td>\n</tr>\n<tr>\n<td><code>npm run live -- &lt;command&gt; [args]</code></td>\n<td>One live command against the running Chrome (JSON out). <code>--stdin</code> for JSON-lines; <code>--agent-id &lt;id&gt;</code> to scope to one agent tab</td>\n</tr>\n<tr>\n<td><code>npm run connect -- &lt;command&gt;</code></td>\n<td>Same idea against a <strong>remote</strong> CDP endpoint (<code>CDP_URL=…</code>)</td>\n</tr>\n<tr>\n<td><code>npm run local-chrome</code></td>\n<td>Start a normal Chrome with a DevTools port, for <code>vnc -- --local-chrome</code></td>\n</tr>\n<tr>\n<td><code>npm run standalone -- &lt;group&gt; &lt;subcommand&gt;</code></td>\n<td>Scriptable CLI: <code>browser</code>, <code>tunnel</code>, <code>ai</code>, <code>api-keys</code></td>\n</tr>\n<tr>\n<td><code>npm run tunnel -- tunnel-&lt;command&gt;</code></td>\n<td>Named tunnels with password-protected ingress</td>\n</tr>\n<tr>\n<td><code>npm run drive-doc</code></td>\n<td>Print LIVE-DRIVE.md</td>\n</tr>\n</tbody></table>\n<pre><code class=\"language-bash\">npm run vnc -- --resolution 1920x1080     # 1080p desktop, viewport matches\nnpm run live -- dump                      # JSON description of the active tab\nnpm run live -- extract-links checkout    # scrape\nnpm run live -- db-select leads           # DuckDB, no browser needed\nnpm run standalone -- ai chat echo &quot;hi&quot;   # offline AI round trip\n</code></pre>\n<hr>\n<h2>Global flags</h2>\n<p>These work in every mode.</p>\n<table>\n<thead>\n<tr>\n<th>Flag</th>\n<th>Default</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>--help</code>, <code>-h</code></td>\n<td></td>\n<td>Print help and exit.</td>\n</tr>\n<tr>\n<td><code>--headed</code>, <code>--no-headless</code></td>\n<td></td>\n<td>Open a real Chrome window instead of running headless. Useful for debugging detection or for solving a CAPTCHA manually.</td>\n</tr>\n<tr>\n<td><code>--headless</code></td>\n<td><code>true</code></td>\n<td>Force headless mode (this is the default already).</td>\n</tr>\n<tr>\n<td><code>--profile=PATH</code></td>\n<td><code>./profile/</code></td>\n<td>Persistent Chrome user-data directory. Cookies, sessions, localStorage, etc. are saved here.</td>\n</tr>\n<tr>\n<td><code>--viewport=WxH</code></td>\n<td><code>1920x1080</code></td>\n<td>Viewport size in CSS pixels.</td>\n</tr>\n<tr>\n<td><code>--resolution=WxH</code></td>\n<td><code>1280x800</code></td>\n<td>VNC display resolution (Xvfb screen size). Also sets viewport. Accepts the shorthand <code>WIDTHxHEIGHT</code> form.</td>\n</tr>\n<tr>\n<td><code>--keep-open</code></td>\n<td><code>false</code></td>\n<td>After the URL finishes loading, don&#39;t auto-close. Useful for <code>--headed</code> debugging.</td>\n</tr>\n<tr>\n<td><code>--executablePath=PATH</code></td>\n<td><code>/usr/bin/google-chrome</code></td>\n<td>Override the Chrome binary location.</td>\n</tr>\n</tbody></table>\n<p>Examples:</p>\n<pre><code class=\"language-bash\"># Use a separate profile for &quot;work&quot; identity\nnode headless.js --profile=./profiles/work https://work-app.com\n\n# Open in a smaller viewport\nnode headless.js --viewport=1280x800 https://example.com\n\n# Set VNC display resolution\nnode headless.js --resolution=1920x1080 https://example.com\n\n# Headed mode for debugging\nnode headless.js --headed https://example.com\n\n# Force headless explicitly\nnode headless.js --headless https://example.com\n</code></pre>\n<hr>\n<h2>Screenshot flags</h2>\n<p>See <a href=\"screenshots.md\">screenshots.md</a> for the conceptual overview.\nHere are the flags.</p>\n<table>\n<thead>\n<tr>\n<th>Flag</th>\n<th>Default</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>--shot</code>, <code>--screenshot</code></td>\n<td><code>false</code></td>\n<td>Take a screenshot of the loaded page.</td>\n</tr>\n<tr>\n<td><code>--shot=PATH</code>, <code>--screenshot=PATH</code></td>\n<td><code>./screenshots/screenshot-&lt;ts&gt;.png</code></td>\n<td>Save to this path. Format is inferred from extension (<code>.png</code>/<code>.jpg</code>).</td>\n</tr>\n<tr>\n<td><code>--full-page</code>, <code>--fullpage</code></td>\n<td><code>false</code></td>\n<td>Capture the entire scrollable page, not just the viewport.</td>\n</tr>\n<tr>\n<td><code>--screenshot-format=png|jpeg</code></td>\n<td><code>png</code></td>\n<td>Image format.</td>\n</tr>\n<tr>\n<td><code>--screenshot-quality=N</code></td>\n<td><code>80</code></td>\n<td>JPEG quality 0-100 (ignored for PNG).</td>\n</tr>\n<tr>\n<td><code>--screenshot-wait=MS</code></td>\n<td><code>1500</code></td>\n<td>Extra ms to wait AFTER the page settles, before snapping. Use to give lazy content time to render.</td>\n</tr>\n<tr>\n<td><code>--screenshot-wait-until=load|domcontentloaded|networkidle</code></td>\n<td><code>networkidle</code></td>\n<td>Wait condition before the extra <code>screenshot-wait</code>.</td>\n</tr>\n</tbody></table>\n<p>Examples:</p>\n<pre><code class=\"language-bash\"># Auto-named under ./screenshots/\nnode headless.js --shot https://example.com\n\n# Explicit path\nnode headless.js --shot=foo.png https://example.com\n\n# Full scrollable page\nnode headless.js --shot --full-page https://example.com\n\n# JPEG with quality\nnode headless.js --shot=pic.jpg --screenshot-format=jpeg --screenshot-quality=70 https://example.com\n\n# Wait 3 seconds for lazy content\nnode headless.js --shot --screenshot-wait=3000 https://example.com\n</code></pre>\n<hr>\n<h2>Search flags</h2>\n<p>See <a href=\"search.md\">search.md</a> for the conceptual overview. Here are the flags.</p>\n<table>\n<thead>\n<tr>\n<th>Flag</th>\n<th>Default</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>--search &quot;QUERY&quot;</code></td>\n<td></td>\n<td>Search query. Accepts the next arg if it doesn&#39;t look like a flag.</td>\n</tr>\n<tr>\n<td><code>--search=QUERY</code>, <code>--search-query=QUERY</code></td>\n<td></td>\n<td>Same, with <code>=</code> syntax.</td>\n</tr>\n<tr>\n<td><code>--search-engine=ENGINE</code></td>\n<td><code>duckduckgo-html</code></td>\n<td><code>duckduckgo-html</code> | <code>brave</code> | <code>searxng</code>. Aliases: <code>ddg</code>.</td>\n</tr>\n<tr>\n<td><code>--search-engine ENGINE</code></td>\n<td></td>\n<td>Space-separated form of the above.</td>\n</tr>\n<tr>\n<td><code>--search-limit=N</code></td>\n<td><code>10</code></td>\n<td>Max results to return.</td>\n</tr>\n<tr>\n<td><code>--search-limit N</code></td>\n<td></td>\n<td>Space-separated form.</td>\n</tr>\n<tr>\n<td><code>--search-json</code></td>\n<td><code>false</code></td>\n<td>Output raw JSON instead of formatted text. Useful for piping to <code>jq</code>.</td>\n</tr>\n<tr>\n<td><code>--search-shot</code>, <code>--search-screenshot</code></td>\n<td><code>false</code></td>\n<td>Also save a screenshot of the results page. Filename: <code>search-&lt;engine&gt;.png</code>.</td>\n</tr>\n<tr>\n<td><code>--searxng-instance=URL</code></td>\n<td><code>https://paulgo.io</code></td>\n<td>Custom SearXNG instance URL (only used if engine is <code>searxng</code>).</td>\n</tr>\n</tbody></table>\n<p>Examples:</p>\n<pre><code class=\"language-bash\"># Default (DuckDuckGo HTML, 10 results, pretty-printed)\nnode headless.js --search &quot;playwright tutorial&quot;\n\n# Limit to 5 results\nnode headless.js --search &quot;playwright tutorial&quot; --search-limit 5\n\n# Use Brave explicitly\nnode headless.js --search &quot;rust async&quot; --search-engine=brave\n\n# Use a custom SearXNG instance\nnode headless.js --search &quot;privacy news&quot; \\\n                 --search-engine=searxng \\\n                 --searxng-instance=https://searx.be\n\n# JSON for piping\nnode headless.js --search &quot;node streams&quot; --search-json | jq &#39;.results[].url&#39;\n\n# Search + screenshot\nnode headless.js --search &quot;hello world&quot; --search-shot\n</code></pre>\n<hr>\n<h2>Fingerprint-check flags</h2>\n<p>The <code>--check URL</code> mode loads a page and runs a battery of\nfingerprint probes. There are no extra flags; the URL is the page\nto probe (a known detection site like <code>https://bot.sannysoft.com</code> or\n<code>https://browserleaks.com</code>).</p>\n<pre><code class=\"language-bash\">node headless.js --check https://bot.sannysoft.com\n</code></pre>\n<p>Output is a single JSON object. See <a href=\"stealth.md\">stealth.md</a> for what\neach field means and what the &quot;passing&quot; values look like.</p>\n<hr>\n<h2>Putting it all together</h2>\n<pre><code class=\"language-bash\"># Realistic scenarios:\n\n# 1. Log in, screenshot the result, search for something\nnode headless.js --profile=./profiles/me --shot=home.png \\\n  --search &quot;weather today&quot; --search-engine=duckduckgo-html \\\n  https://my-app.com\n\n# 2. Stealth run with custom viewport and JPEG screenshot\nnode headless.js --viewport=1280x800 \\\n  --shot=full.jpg --screenshot-format=jpeg --screenshot-quality=60 \\\n  --full-page https://example.com\n\n# 3. Run a search via SearXNG, output JSON\nnode headless.js --search &quot;node streams&quot; \\\n  --search-engine=searxng --searxng-instance=https://searx.be \\\n  --search-json | jq &#39;.results[] | {title, url}&#39;\n</code></pre>\n<p>See the per-feature pages (<a href=\"screenshots.md\">screenshots.md</a>,\n<a href=\"search.md\">search.md</a>, <a href=\"stealth.md\">stealth.md</a>,\n<a href=\"persistence.md\">persistence.md</a>) for the conceptual details behind\neach flag.</p>\n","headings":[]},{"name":"index","file":"index.md","html":"<h1>ServerBrowser — Stealth Headless Google Chrome (via Playwright)</h1>\n<p>A persistent, real-Chrome, hard-to-detect browsing and web-search toolkit\nfor Node.js, built on top of <a href=\"https://playwright.dev/\">Playwright</a>.</p>\n<ul>\n<li>Uses <strong>real Google Chrome 140</strong> (<code>/usr/bin/google-chrome</code>), not bundled\nChromium, so it doesn&#39;t carry the &quot;this is a headless Chromium&quot;\nfingerprint that anti-bot services look for.</li>\n<li><strong>Persistent profile</strong> (<code>./profile/</code>) — cookies, localStorage, sessions,\nservice workers, IndexedDB all survive between runs.</li>\n<li><strong>Stealth init script</strong> patches the most common bot-detection signals\n(<code>navigator.webdriver</code>, missing <code>window.chrome</code>, SwiftShader WebGL,\netc.) before any page script runs.</li>\n<li><strong>Screenshot capture</strong> — automatic on launch, or ad-hoc at any time.</li>\n<li><strong>Web search</strong> via bot-friendly engines with a built-in <strong>fallback\nchain</strong> (DuckDuckGo HTML → Brave → SearXNG).</li>\n</ul>\n<blockquote>\n<p><strong>Use responsibly.</strong> This toolkit is designed to remove the <em>technical</em>\ntells of automation (so you stop being flagged just for being a\nheadless browser). It does not bypass CAPTCHAs or login walls, and\ndoes not help you violate any site&#39;s ToS.</p>\n</blockquote>\n<hr>\n<h2>Quick start</h2>\n<pre><code class=\"language-bash\"># 1. Open a URL, print the page title\nnode headless.js https://example.com\n\n# 2. Open a URL and save a screenshot\nnode headless.js --shot https://example.com\n\n# 3. Search the web\nnode headless.js --search &quot;playwright tutorial&quot;\n\n# 4. Run a fingerprint check to see how undetectable you are\nnode headless.js --check https://bot.sannysoft.com\n</code></pre>\n<p>Programmatic use:</p>\n<pre><code class=\"language-js\">const { launch, search, screenshot } = require(&#39;./headless&#39;);\n\n(async () =&gt; {\n  const { page, human, screenshot, close } = await launch({\n    url:        &#39;https://example.com&#39;,\n    screenshot: true,                  // auto-screenshot on load\n    screenshotPath: &#39;home.png&#39;,\n  });\n\n  // Type into a search box like a human\n  await human.type(&#39;input[name=q]&#39;, &#39;playwright&#39;);\n  await human.click(&#39;button[type=submit]&#39;);\n  await page.waitForLoadState(&#39;networkidle&#39;);\n\n  // Take another screenshot after the search\n  await screenshot(&#39;results.png&#39;);\n\n  // Or use the high-level search helper\n  const r = await search(&#39;node.js streams&#39;, { limit: 5 });\n  console.log(r.results);\n\n  await close();\n})();\n</code></pre>\n<hr>\n<h2>Documentation map</h2>\n<table>\n<thead>\n<tr>\n<th>Page</th>\n<th>What it covers</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a href=\"installation.md\">installation.md</a></td>\n<td>Prerequisites, install, verify the install works.</td>\n</tr>\n<tr>\n<td><a href=\"quickstart.md\">quickstart.md</a></td>\n<td>5-minute tour of the most useful CLI invocations.</td>\n</tr>\n<tr>\n<td><a href=\"cli.md\">cli.md</a></td>\n<td>Full reference for every CLI flag, with examples.</td>\n</tr>\n<tr>\n<td><a href=\"COMMANDS.md\">COMMANDS.md</a></td>\n<td>Every command across all four command tables, plus the <code>PROPOSED</code> commands the run scripts still need.</td>\n</tr>\n<tr>\n<td><a href=\"LIVE-DRIVE.md\">LIVE-DRIVE.md</a></td>\n<td>The live VNC session: <code>npm run vnc</code>, watching and driving real Chrome over CDP.</td>\n</tr>\n<tr>\n<td><a href=\"api.md\">api.md</a></td>\n<td>Library API: <code>launch()</code>, <code>search()</code>, <code>screenshot()</code>, <code>human</code>, <code>close</code>.</td>\n</tr>\n<tr>\n<td><a href=\"stealth.md\">stealth.md</a></td>\n<td>What the stealth layer does, what it doesn&#39;t, Cloudflare Turnstile handling, and how to test it.</td>\n</tr>\n<tr>\n<td><a href=\"screenshots.md\">screenshots.md</a></td>\n<td>All the ways to take a screenshot.</td>\n</tr>\n<tr>\n<td><a href=\"search.md\">search.md</a></td>\n<td>Search engines, fallback chain, output, options.</td>\n</tr>\n<tr>\n<td><a href=\"persistence.md\">persistence.md</a></td>\n<td>How the persistent profile works, when to reset it.</td>\n</tr>\n<tr>\n<td><a href=\"architecture.md\">architecture.md</a></td>\n<td>How the four source files fit together.</td>\n</tr>\n<tr>\n<td><a href=\"troubleshooting.md\">troubleshooting.md</a></td>\n<td>Common problems and their fixes.</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>File map (this folder)</h2>\n<pre><code>ServerBrowser/\n├── headless.js          # Main entry point. CLI + library API.   (~640 lines)\n├── search.js            # Web search via 3 engines + fallback.   (~330 lines)\n├── stealth.js           # Init script that hides bot tells.      (~230 lines)\n├── example.js           # Drop-in usage example.                 (~30 lines)\n├── README.md            # Short overview (this kind of doc).     (~280 lines)\n├── docs/                # You are here.\n│   ├── index.md         # ← this file\n│   ├── installation.md\n│   ├── quickstart.md\n│   ├── cli.md\n│   ├── COMMANDS.md\n│   ├── LIVE-DRIVE.md\n│   ├── api.md\n│   ├── stealth.md\n│   ├── screenshots.md\n│   ├── search.md\n│   ├── persistence.md\n│   ├── architecture.md\n│   └── troubleshooting.md\n├── profile/             # Persistent Chrome user-data dir (auto-created).\n└── screenshots/         # Default output dir for ad-hoc screenshots.\n</code></pre>\n<hr>\n<h2>Requirements</h2>\n<ul>\n<li><strong>Node.js 18+</strong> (the project uses native <code>URL</code>, <code>fs.promises</code>, etc.)</li>\n<li><strong>Google Chrome 120+</strong> installed at <code>/usr/bin/google-chrome</code>\n(or anywhere on <code>$PATH</code>).</li>\n<li><strong>Playwright</strong> 1.40+ installed globally\n(<code>npm install -g playwright</code> is enough — the project uses the global\nmodule by virtue of running from a folder that has <code>playwright</code> in\nits <code>node_modules</code>).</li>\n</ul>\n<p>See <a href=\"installation.md\">installation.md</a> for the exact commands.</p>\n","headings":[]},{"name":"installation","file":"installation.md","html":"<h1>Installation</h1>\n<h2>Prerequisites</h2>\n<p>You need three things on the machine where you&#39;ll run <code>ServerBrowser/</code>:</p>\n<table>\n<thead>\n<tr>\n<th>Requirement</th>\n<th>Minimum version</th>\n<th>How to check</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Node.js</td>\n<td>18.x</td>\n<td><code>node --version</code></td>\n</tr>\n<tr>\n<td>Google Chrome</td>\n<td>120+</td>\n<td><code>google-chrome --version</code> (or <code>google-chrome-stable --version</code>)</td>\n</tr>\n<tr>\n<td>Playwright</td>\n<td>1.40+</td>\n<td><code>playwright --version</code></td>\n</tr>\n</tbody></table>\n<p>This project uses Playwright but does <strong>not</strong> depend on the Playwright\nbrowser bundles (Chromium / Firefox / WebKit). It always launches the\n<strong>system Google Chrome</strong>, so you do not need to run\n<code>playwright install</code>.</p>\n<h2>1. Install Node.js</h2>\n<p>If <code>node --version</code> is older than 18, install a current LTS:</p>\n<pre><code class=\"language-bash\"># Debian / Ubuntu\ncurl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -\nsudo apt-get install -y nodejs\n\n# Or via nvm (any Linux/macOS)\ncurl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash\nnvm install --lts\n</code></pre>\n<h2>2. Install Google Chrome</h2>\n<p>The project assumes <code>/usr/bin/google-chrome</code> exists. Install:</p>\n<pre><code class=\"language-bash\"># Debian / Ubuntu\nwget -q -O - https://dl.google.com/linux/linux_signing_key.pub \\\n  | sudo apt-key add - \\\n  &amp;&amp; echo &quot;deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main&quot; \\\n  | sudo tee /etc/apt/sources.list.d/google-chrome.list \\\n  &amp;&amp; sudo apt-get update \\\n  &amp;&amp; sudo apt-get install -y google-chrome-stable\n\n# macOS\nbrew install --cask google-chrome\n\n# Or download the .deb / .dmg directly from\n# https://www.google.com/chrome/\n</code></pre>\n<p>If Chrome lives somewhere other than <code>/usr/bin/google-chrome</code>, pass\n<code>--executablePath=...</code> to <code>launch()</code> (library) or set\n<code>executablePath</code> in the launch options.</p>\n<h2>3. Install Playwright</h2>\n<p>The <code>ServerBrowser/</code> folder already has a <code>node_modules/</code> with <code>playwright</code>\nand <code>chalk</code> (it shares the parent <code>htdocs</code> folder&#39;s <code>node_modules</code>).\nIf you need to install fresh:</p>\n<pre><code class=\"language-bash\"># In the parent folder (htdocs):\ncd /opt/lampp/htdocs\nnpm install playwright chalk\n\n# Or globally if you don&#39;t want a per-project install:\nnpm install -g playwright\n</code></pre>\n<p>The global install is sufficient because <code>require(&#39;playwright&#39;)</code> will\nfind the global module if no local one is present.</p>\n<h2>4. Install Firefox and Chromium (optional)</h2>\n<p>The default browser is the <strong>system Google Chrome</strong> (launched via\n<code>--browser=chrome</code>). To use Playwright-managed Firefox or Chromium\ninstead — for example if you don&#39;t have system Chrome installed, or\nneed an isolated profile without a persistent user-data-dir — install\nthem with:</p>\n<pre><code class=\"language-bash\"># Install the Firefox bundle\nnpx playwright install firefox\n\n# Install the Chromium bundle\nnpx playwright install chromium\n</code></pre>\n<p>Both commands download the browser binaries into <code>~/.cache/ms-playwright/</code>\n(overridable with <code>PLAYWRIGHT_BROWSERS_PATH</code>).</p>\n<h3>When to use each</h3>\n<table>\n<thead>\n<tr>\n<th>Browser</th>\n<th>Use case</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>chrome</code> (default)</td>\n<td>System Google Chrome; best anti-detection (stealth layer tuned for Chrome).</td>\n</tr>\n<tr>\n<td><code>firefox</code></td>\n<td>Isolated profile; different fingerprint; useful for cross-browser tests.</td>\n</tr>\n<tr>\n<td><code>chromium</code></td>\n<td>Playwright-managed Chromium; smallest install; good for CI.</td>\n</tr>\n</tbody></table>\n<p>Select at launch time with:</p>\n<pre><code class=\"language-bash\"># Firefox\nnpm run vnc -- --browser=firefox\n\n# Chromium\nnpm run vnc -- --browser=chromium\n</code></pre>\n<p>Or via env:</p>\n<pre><code class=\"language-bash\">BROWSER=firefox npm run vnc\n</code></pre>\n<h2>5. Browser constraints</h2>\n<h3>Firefox CDP limitations in Playwright</h3>\n<p>Playwright&#39;s Firefox channel <strong>does not support Chrome DevTools Protocol (CDP)</strong>\nas a first-class target. The <code>--browser=firefox</code> path in <code>vnc-driver.js</code> launches\nFirefox and attaches via Playwright&#39;s own protocol (not CDP). This means:</p>\n<ul>\n<li><strong><code>connectOverCDP</code> is unavailable</strong> for Firefox. Automation that depends on raw\nCDP (stealth plugins, session manipulation) works only with <code>chrome</code> / <code>chromium</code>.</li>\n<li>Firefox&#39;s anti-detection fingerprint differs from Chrome. The stealth layer is\ntuned for Blink/Chrome; running with Firefox may surface <code>navigator.webdriver</code>\ndifferently or lack Chrome-specific <code>window.chrome</code> properties.</li>\n<li>Session/cookie APIs behave differently in Gecko. Stored scripts that call\n<code>chromium.launch()</code> and rely on Chrome-specific <code>context</code> or <code>page</code> behaviours\nshould be tested against the intended target before production use.</li>\n</ul>\n<h3><code>chrome</code> vs <code>chromium</code> vs <code>firefox</code></h3>\n<table>\n<thead>\n<tr>\n<th>Dimension</th>\n<th><code>chrome</code></th>\n<th><code>chromium</code></th>\n<th><code>firefox</code></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>CDP support</td>\n<td>Full (primary target)</td>\n<td>Full</td>\n<td>None (Playwright protocol only)</td>\n</tr>\n<tr>\n<td>Stealth layer</td>\n<td>Full (blink-specific)</td>\n<td>Full (blink-specific)</td>\n<td>Partial (gecko-specific stubs)</td>\n</tr>\n<tr>\n<td><code>window.chrome</code></td>\n<td>Present</td>\n<td>Present</td>\n<td>Absent</td>\n</tr>\n<tr>\n<td><code>navigator.webdriver</code></td>\n<td>Suppressed</td>\n<td>Suppressed</td>\n<td>May differ by version</td>\n</tr>\n<tr>\n<td>Profile persistence</td>\n<td>user-data-dir</td>\n<td>temp dir</td>\n<td>temp dir</td>\n</tr>\n<tr>\n<td>Anti-bot fingerprint</td>\n<td>Chrome 120+</td>\n<td>Current snapshot</td>\n<td>Firefox ESR</td>\n</tr>\n<tr>\n<td>Install</td>\n<td>System Chrome only</td>\n<td><code>npx playwright install chromium</code></td>\n<td><code>npx playwright install firefox</code></td>\n</tr>\n</tbody></table>\n<p><strong>Recommendation:</strong> use <code>chrome</code> (system Google Chrome) for production automation.\nUse <code>chromium</code> for CI where anti-bot fingerprint is less critical.\nUse <code>firefox</code> only for cross-browser validation or when Chrome is unavailable.</p>\n<h2>6. Optional: tunnel provider binaries</h2>\n<p>The tunnel commands run a local password gate (pure Node, always available). To\npublish a public URL you also need one of these:</p>\n<pre><code class=\"language-bash\"># Cloudflare quick tunnels\ncurl -fsSL https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/ | sh\n\n# or ngrok\ncurl -fsSL https://ngrok.com/install | sh   # needs an account/token\n</code></pre>\n<p>Neither is required for <code>tunnel-*</code> with the <code>custom</code> provider, which is handy\nfor testing and for pointing your own reverse proxy at the gate.</p>\n<hr>\n<h2>7. Optional: Xvfb / x11vnc / noVNC (the VNC stack)</h2>\n<p>To watch the browser over VNC you need the display and web-view pieces:</p>\n<pre><code class=\"language-bash\"># Debian / Ubuntu\nsudo apt-get install -y xvfb x11vnc novnc websockify\n\n# Fedora\nsudo dnf install -y xorg-x11-server-Xvfb x11vnc novnc python3-websockify\n</code></pre>\n<p>Verify the whole stack, including the resolution wiring:</p>\n<pre><code class=\"language-bash\">npm run vnc -- --resolution 1280x720        # prints viewer/CDP URLs, stays up\nbash scripts/smoke-test-vnc-resolution.sh 1440 900   # headless check, exits 0\n</code></pre>\n<h2>8. Verify the install</h2>\n<pre><code class=\"language-bash\">cd /opt/lampp/htdocs/ServerBrowser\nnode -e &quot;const m = require(&#39;./headless&#39;); console.log(&#39;OK:&#39;, Object.keys(m).join(&#39;, &#39;));&quot;\n</code></pre>\n<p>You should see the exported API keys:</p>\n<p>Expected output (something like):</p>\n<pre><code>OK: launch, makeHumanizer, search, formatResults, ENGINES, ENGINE_ALIASES, DEFAULT_ENGINE, FALLBACK_CHAIN, REAL_UA, DEFAULT_PROFILE\n</code></pre>\n<p>If you see <code>Cannot find module &#39;playwright&#39;</code>, see\n<a href=\"troubleshooting.md\">troubleshooting.md</a>.</p>\n<h2>9. Smoke test</h2>\n<pre><code class=\"language-bash\"># This will open a URL, print its title, and exit.\nnode headless.js https://example.com\n</code></pre>\n<p>Expected output:</p>\n<pre><code>Opened: https://example.com/\nTitle:  Example Domain\nProfile dir: /opt/lampp/htdocs/ServerBrowser/profile\n</code></pre>\n<p>If you get a &quot;Failed to launch Google Chrome&quot; error, double-check\nthat <code>/usr/bin/google-chrome</code> exists and is executable:</p>\n<pre><code class=\"language-bash\">ls -la /usr/bin/google-chrome\ngoogle-chrome --version\n</code></pre>\n","headings":[]},{"name":"persistence","file":"persistence.md","html":"<h1>Persistence</h1>\n<p><code>launch()</code> uses <code>chromium.launchPersistentContext()</code>, which writes a\n<strong>real Chrome user-data directory</strong> to disk. Everything Chrome would\nnormally persist for a regular user profile persists across runs.</p>\n<h2>What survives between runs</h2>\n<table>\n<thead>\n<tr>\n<th>Data</th>\n<th>Persisted?</th>\n<th>Where in the profile</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Cookies</td>\n<td>✅</td>\n<td><code>Default/Cookies</code> (SQLite)</td>\n</tr>\n<tr>\n<td><code>localStorage</code></td>\n<td>✅</td>\n<td><code>Default/Local Storage/leveldb/</code></td>\n</tr>\n<tr>\n<td><code>sessionStorage</code></td>\n<td>❌ (per-session only)</td>\n<td>—</td>\n</tr>\n<tr>\n<td><code>IndexedDB</code></td>\n<td>✅</td>\n<td><code>Default/IndexedDB/</code></td>\n</tr>\n<tr>\n<td>Service workers</td>\n<td>✅</td>\n<td><code>Default/Service Worker/</code></td>\n</tr>\n<tr>\n<td>Cache</td>\n<td>✅</td>\n<td><code>Default/Code Cache/</code>, <code>Default/Cache/</code></td>\n</tr>\n<tr>\n<td>Logins / autofill</td>\n<td>❌ (we explicitly turn this off)</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Browsing history</td>\n<td>✅ (Chrome&#39;s default)</td>\n<td><code>Default/History</code></td>\n</tr>\n<tr>\n<td>Extensions</td>\n<td>❌ (we launch with <code>--disable-extensions</code>)</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Permissions / grant decisions</td>\n<td>✅</td>\n<td><code>Default/Preferences</code></td>\n</tr>\n</tbody></table>\n<p>The reason logins and autofill are disabled: they&#39;re stored in\ndetectable formats that a fresh, clean browser profile wouldn&#39;t have,\nand they leak into the fingerprint.</p>\n<h2>Default location</h2>\n<p>The default profile is:</p>\n<pre><code>&lt;this folder&gt;/profile/\n</code></pre>\n<p>Concretely, after one run you&#39;ll see:</p>\n<pre><code>profile/\n├── Default/\n│   ├── Cookies                ← SQLite, real Chrome format\n│   ├── Cookies-journal\n│   ├── Preferences            ← JSON, includes permission grants\n│   ├── Local Storage/         ← leveldb for localStorage\n│   ├── IndexedDB/             ← IndexedDB\n│   ├── Code Cache/\n│   ├── Cache/\n│   ├── History\n│   ├── ... many more\n├── Local State                ← top-level Chrome state\n├── Last Version\n├── GrShaderCache/\n├── GraphiteDawnCache/\n└── ...\n</code></pre>\n<h2>Using multiple profiles</h2>\n<p>Pass <code>--profile=PATH</code> (CLI) or <code>profileDir: PATH</code> (library) to use a\ndifferent profile:</p>\n<pre><code class=\"language-bash\"># Different profile per identity\nnode headless.js --profile=./profiles/work    https://work-app.com\nnode headless.js --profile=./profiles/personal https://other-app.com\n</code></pre>\n<pre><code class=\"language-js\">const { launch } = require(&#39;./headless&#39;);\nconst { page, close } = await launch({\n  profileDir: &#39;./profiles/work&#39;,\n  url: &#39;https://work-app.com&#39;,\n});\n</code></pre>\n<p>Two runs with different <code>profileDir</code>s are completely isolated — they\nshare no cookies, no localStorage, no anything. Treat them as\nseparate Chrome installs.</p>\n<h2>When to reset a profile</h2>\n<p>You generally <strong>don&#39;t</strong> need to — the profile is self-healing. But\nyou may want to reset in these cases:</p>\n<ul>\n<li><strong>Cookies got out of sync</strong> (e.g. you changed your password\nupstream). Delete <code>profile/Default/Cookies</code>.</li>\n<li><strong>A site&#39;s state is corrupted</strong> (e.g. a half-completed onboarding\nflow is making the next run loop). Delete the whole profile dir.</li>\n<li><strong>You want a clean stealth run</strong> for a one-off check. Pass\n<code>--profile=./profiles/clean</code>.</li>\n<li><strong>The profile grew too large</strong> (it&#39;s been months of heavy use).\nDelete it; Chrome will rebuild it on next run.</li>\n</ul>\n<p>To reset fully:</p>\n<pre><code class=\"language-bash\">rm -rf /opt/lampp/htdocs/ServerBrowser/profile/\n</code></pre>\n<h2>Inspecting the profile</h2>\n<p>The profile is a normal Chrome user-data dir, so you can poke at it\nwith standard tools:</p>\n<pre><code class=\"language-bash\"># See the cookies\nsqlite3 profile/Default/Cookies &quot;SELECT host_key, name, value FROM cookies LIMIT 10;&quot;\n\n# See the permissions\ncat profile/Default/Preferences | python3 -m json.tool | less\n</code></pre>\n<h2>Why a persistent profile is also good for stealth</h2>\n<p>Anti-bot systems often check the <em>consistency</em> of a profile: does\nthis user have a history? Have they visited these sites before?\nAre their cookies consistent with their claimed identity?</p>\n<p>A fresh, empty profile on every run is <strong>its own</strong> tell — real users\nalmost never have an empty profile. By keeping the profile\npersistent, you:</p>\n<ul>\n<li>Build up a (small) browsing history over time.</li>\n<li>Accumulate realistic cookies.</li>\n<li>Get realistic cache hits.</li>\n<li>Make the browser look like a real returning visitor, not a\none-shot automated script.</li>\n</ul>\n<h2>Security notes</h2>\n<p>The profile dir contains cookies — anyone with read access to the\nfilesystem can impersonate you on every site you&#39;ve logged into. On\nshared systems:</p>\n<ul>\n<li>Don&#39;t run <code>ServerBrowser/</code> as root for personal accounts (you&#39;re\ncurrently running as root in this XAMPP setup, which is fine for\ndev but treat the profile as sensitive).</li>\n<li>Set <code>chmod 700</code> on the profile dir.</li>\n<li>Consider encrypting the filesystem if the box is multi-user.</li>\n</ul>\n<h2>What does NOT persist</h2>\n<ul>\n<li><strong>In-memory JavaScript state</strong> — the JS heap is per-process.</li>\n<li><strong>The current page</strong> — the browser always starts at\n<code>about:blank</code> (or whatever URL you pass to <code>launch()</code>).</li>\n<li><strong>The active download list</strong> — downloads are per-session.</li>\n<li><strong>Open DevTools</strong> — but the stealth patches make this moot\nanyway, since there&#39;s nothing suspicious to find.</li>\n<li><strong>Geolocation permission grants</strong> beyond the first run** —\nactually, these do persist. If you <code>grantPermissions</code> something\nin one run, it&#39;s there next time.</li>\n</ul>\n","headings":[]},{"name":"quickstart","file":"quickstart.md","html":"<h1>Quickstart (5-minute tour)</h1>\n<p>The fastest way to see what <code>ServerBrowser/</code> can do.</p>\n<h2>1. Open a URL</h2>\n<pre><code class=\"language-bash\">node headless.js https://example.com\n</code></pre>\n<p>Output:</p>\n<pre><code>Opened: https://example.com/\nTitle:  Example Domain\nProfile dir: /opt/lampp/htdocs/ServerBrowser/profile\n</code></pre>\n<p>This launches real headless Chrome 140, navigates to the URL, prints\nthe title, and exits. The persistent profile under <code>./profile/</code> is\nsaved for next time.</p>\n<h2>2. Open + screenshot</h2>\n<pre><code class=\"language-bash\">node headless.js --shot https://example.com\n</code></pre>\n<p>Output:</p>\n<pre><code>[screenshot] saved 98953 bytes -&gt; /opt/lampp/htdocs/ServerBrowser/screenshots/screenshot-2026-07-20_15-00-30.png\nOpened: https://example.com/\nTitle:  Example Domain\nProfile dir: /opt/lampp/htdocs/ServerBrowser/profile\nScreenshot: /opt/lampp/htdocs/ServerBrowser/screenshots/screenshot-2026-07-20_15-00-30.png\n</code></pre>\n<p>The screenshot is auto-named under <code>./screenshots/</code> with a timestamp.</p>\n<p>For a specific path:</p>\n<pre><code class=\"language-bash\">node headless.js --shot=foo.png https://example.com\n</code></pre>\n<p>For the <strong>full</strong> scrollable page (not just the viewport):</p>\n<pre><code class=\"language-bash\">node headless.js --shot --full-page https://example.com\n</code></pre>\n<p>See <a href=\"screenshots.md\">screenshots.md</a> for the full reference.</p>\n<h2>3. Search the web</h2>\n<pre><code class=\"language-bash\">node headless.js --search &quot;playwright tutorial&quot; --search-limit 5\n</code></pre>\n<p>Output:</p>\n<pre><code>Search: playwright tutorial  (engine: duckduckgo-html, 5 results)\n  1. Playwright Python Tutorial | BrowserStack\n     https://www.browserstack.com/guide/playwright-python\n     ...\n  2. Getting Started | Playwright Python\n     https://playwright.dev/python/docs/intro\n     ...\n  ...\n</code></pre>\n<p>This uses the <strong>DuckDuckGo HTML</strong> endpoint under the hood (which is\npurpose-built for bots and never throws a captcha). If that ever\nfails, it automatically falls back to <strong>Brave Search</strong> and then to\n<strong>SearXNG</strong>.</p>\n<p>See <a href=\"search.md\">search.md</a> for the full reference.</p>\n<h2>4. Run a fingerprint check</h2>\n<pre><code class=\"language-bash\">node headless.js --check https://bot.sannysoft.com\n</code></pre>\n<p>Output (formatted as JSON):</p>\n<pre><code class=\"language-json\">{\n  &quot;userAgent&quot;: &quot;Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0.0 Safari/537.36&quot;,\n  &quot;webdriver&quot;: undefined,\n  &quot;languages&quot;: [&quot;en-US&quot;, &quot;en&quot;],\n  &quot;language&quot;: &quot;en-US&quot;,\n  &quot;plugins&quot;: 6,\n  &quot;mimeTypes&quot;: 4,\n  &quot;hasChrome&quot;: true,\n  &quot;hasChromeRuntime&quot;: true,\n  &quot;hasChromeCSI&quot;: true,\n  &quot;hasChromeLoadTimes&quot;: true,\n  &quot;hardwareConcurrency&quot;: 4,\n  &quot;deviceMemory&quot;: 8,\n  &quot;webglVendor&quot;: &quot;Intel Inc.&quot;,\n  &quot;webglRenderer&quot;: &quot;Intel Iris OpenGL Engine&quot;,\n  ...\n}\n</code></pre>\n<p>The fact that <code>webdriver</code> is missing (== <code>undefined</code>) is the whole\npoint: the headless browser doesn&#39;t reveal that it&#39;s automated.</p>\n<p>See <a href=\"stealth.md\">stealth.md</a> for the full breakdown of what the\nstealth layer patches and how to test it.</p>\n<h2>5. Use it as a library</h2>\n<pre><code class=\"language-js\">const { launch, search, screenshot } = require(&#39;./headless&#39;);\n\n(async () =&gt; {\n  // 1. Launch a stealth headless Chrome\n  const { page, human, close } = await launch({\n    url: &#39;https://example.com/login&#39;,\n    screenshot: true,                  // auto-screenshot the page on load\n  });\n\n  // 2. Type into a form like a human\n  await human.type(&#39;input[name=email]&#39;,    &#39;me@example.com&#39;);\n  await human.think();\n  await human.type(&#39;input[name=password]&#39;, &#39;hunter2&#39;);\n  await human.click(&#39;button[type=submit]&#39;);\n  await page.waitForLoadState(&#39;networkidle&#39;);\n\n  // 3. Take a screenshot of the result\n  await screenshot(&#39;logged-in.png&#39;, { fullPage: true });\n\n  // 4. Run a web search in the same session (cookies / profile shared)\n  const r = await search(&#39;node js&#39;, { limit: 3 });\n  console.log(r.results);\n\n  await close();\n})();\n</code></pre>\n<h2>6. Headed mode (visible window)</h2>\n<p>If you want to <strong>see</strong> the browser, for debugging or to solve a\nCAPTCHA manually:</p>\n<pre><code class=\"language-bash\">node headless.js --headed https://example.com\n</code></pre>\n<p>This opens a real Chrome window with the stealth patches still\napplied. Cookies you log in with persist into the profile, so the\nnext headless run finds you logged in.</p>\n<h2>7. Custom profile per project</h2>\n<p>If you have several independent &quot;identities&quot; (e.g. one per account\nyou&#39;re managing), use a different profile per identity:</p>\n<pre><code class=\"language-bash\">node headless.js --profile=./profiles/work    https://work-app.com\nnode headless.js --profile=./profiles/personal https://other-app.com\n</code></pre>\n<p>The profile dir is just a normal Chrome user-data directory, so you\ncan inspect it with <code>ls profile/Default/Cookies</code> (it&#39;s a SQLite DB).</p>\n<hr>\n<h2>Next steps</h2>\n<ul>\n<li>Full <strong>CLI reference</strong> — <a href=\"cli.md\">cli.md</a></li>\n<li>Full <strong>library API</strong> — <a href=\"api.md\">api.md</a></li>\n<li><strong>How the stealth layer works</strong> — <a href=\"stealth.md\">stealth.md</a></li>\n<li><strong>Web search</strong> — <a href=\"search.md\">search.md</a></li>\n<li><strong>Screenshots</strong> — <a href=\"screenshots.md\">screenshots.md</a></li>\n<li><strong>Persistence model</strong> — <a href=\"persistence.md\">persistence.md</a></li>\n</ul>\n","headings":[]},{"name":"screenshots","file":"screenshots.md","html":"<h1>Screenshots</h1>\n<p>There are two ways to take a screenshot:</p>\n<ol>\n<li><strong>Auto-screenshot</strong> — taken once, right after the page settles,\nwhen you pass <code>screenshot: true</code> (or <code>--shot</code>) to <code>launch()</code>.</li>\n<li><strong>Ad-hoc screenshot</strong> — taken at any time during the session via\nthe <code>screenshot(filePath?, opts?)</code> helper returned by <code>launch()</code>.</li>\n</ol>\n<p>Both paths write to disk and return the <strong>absolute path</strong> of the\nfile. Both paths update the <code>lastScreenshotPath</code> getter on the\nlaunch result.</p>\n<h2>Auto-screenshot (CLI)</h2>\n<pre><code class=\"language-bash\"># Auto-named under ./screenshots/screenshot-&lt;timestamp&gt;.png\nnode headless.js --shot https://example.com\n\n# Explicit path\nnode headless.js --shot=foo.png https://example.com\n\n# Full scrollable page, not just the viewport\nnode headless.js --shot --full-page https://example.com\n\n# JPEG with quality 70\nnode headless.js --shot=pic.jpg --screenshot-format=jpeg --screenshot-quality=70 https://example.com\n\n# Wait 3 seconds before snapping (so lazy content settles)\nnode headless.js --shot --screenshot-wait=3000 https://example.com\n</code></pre>\n<h2>Auto-screenshot (library)</h2>\n<pre><code class=\"language-js\">const { launch } = require(&#39;./headless&#39;);\n\nconst { lastScreenshotPath, close } = await launch({\n  url: &#39;https://example.com&#39;,\n  screenshot: true,                  // turn it on\n  screenshotPath: &#39;home.png&#39;,        // optional\n  screenshotFullPage: true,          // optional\n  screenshotFormat: &#39;png&#39;,           // &#39;png&#39; or &#39;jpeg&#39;\n  screenshotQuality: 80,             // jpeg only\n  screenshotWait: 2000,              // extra settle time\n  screenshotWaitUntil: &#39;networkidle&#39;,\n});\n\nconsole.log(&#39;saved to&#39;, lastScreenshotPath);\nawait close();\n</code></pre>\n<h3>Lifecycle</h3>\n<ol>\n<li><code>launch()</code> navigates to <code>url</code> and resolves the context/page.</li>\n<li>The helper waits for <code>screenshotWaitUntil</code> (default <code>networkidle</code>)\nwith a 30s timeout. (If the page never settles, it falls through\nanyway — a half-loaded page is better than no screenshot.)</li>\n<li>The helper waits an additional <code>screenshotWait</code> ms (default 1500).</li>\n<li>The scre
